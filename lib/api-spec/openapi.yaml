        Assigning the package copies these onto each client service by value, so
        editing the package later never rewrites work already scheduled.
      required: [id, name, serviceIds, items]
      properties:
        id: { type: integer }
        name: { type: string }
        description: { type: ["string", "null"] }
        serviceIds:
          type: array
