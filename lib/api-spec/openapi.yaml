            balance. Bills still waiting to be verified are left out, along with any
            money taken at the door for them - this is the figure the printed coupon
            and the emailed bill quote to the customer.
        unappliedCredit:
          type: number
          description: Credit sitting on the customer's account, not yet applied to any invoice
        daysPastDue:
          type: integer
          description: Days past the due date (invoice date when due on receipt); 0 when not past due or nothing owed
        lastPaymentMethod:
          type: ["string", "null"]
          description: How this customer last paid, any invoice — his "how they pay" column
        notes: { type: ["string", "null"] }
        number:
          type: integer
          description: The number the customer sees; falls back to id on legacy rows
        invoiceDate: { type: ["string", "null"] }
        dueDate: { type: ["string", "null"] }
        terms: { type: ["string", "null"] }
        poNumber: { type: ["string", "null"] }
        sentAt: { type: ["string", "null"] }
        verifiedAt: { type: ["string", "null"] }
        verifiedById: { type: ["integer", "null"] }
        needsVerification:
          type: boolean
          description: The office has not checked this bill yet (verifiedAt is empty, it is not void, and it has never been emailed or printed). Read this, not the status - a bill paid in full at the door is already "paid" and still needs checking, while one the customer already holds was checked by the act of going out.
        deliveryMethod:
          type: ["string", "null"]
          description: Snapshot of the customer's delivery preference at verify time (email, print, both)
        printedAt: { type: ["string", "null"] }
        lines:
          type: array
          items:
            $ref: "#/components/schemas/InvoiceLineItem"
        createdAt: { type: string }
    InvoiceLineItem:
      type: object
      required: [id, invoiceId, description, quantity, unitPrice, total, sortOrder]
      properties:
        id: { type: integer }
        invoiceId: { type: integer }
        description: { type: string }
        serviceDate:
          type: ["string", "null"]
          description: Date-only (YYYY-MM-DD) of the visit this line bills
        quantity: { type: number }
        unitPrice: { type: number }
        total: { type: number }
        sortOrder: { type: integer }
        jobId:
          type: ["integer", "null"]
          description: The missed job this line was added for; null for the invoice's own job or a typed line
    InvoiceLineItemInput:
      type: object
      required: [description]
      properties:
        description: { type: string, minLength: 1 }
        serviceDate: { type: ["string", "null"] }
        quantity: { type: number, default: 1 }
        unitPrice: { type: number, default: 0 }
        jobId: { type: ["integer", "null"] }
    InvoiceBatchEmailInput:
      type: object
      required: [ids]
      properties:
        ids:
          type: array
          minItems: 1
          maxItems: 500
          items: { type: integer }
    InvoiceBatchEmailResult:
      type: object
      required: [batchId, sent, failed, skipped]
      properties:
        batchId: { type: string }
        sent: { type: integer }
        failed:
          type: array
          items:
            $ref: "#/components/schemas/InvoiceBatchOutcome"
        skipped:
          type: array
          items:
            $ref: "#/components/schemas/InvoiceBatchOutcome"
    InvoiceBatchOutcome:
      type: object
      required: [invoiceId, number, clientName, reason]
      properties:
        invoiceId: { type: integer }
        number: { type: integer }
        clientName: { type: ["string", "null"] }
        reason:
          type: string
          description: >-
            no_email, not_verified, void, already_sent, or the error text.
            do_not_email is not one of them: that box stops bulk notices, not a
            customer's bill.
    AttachJobInput:
      type: object
      required: [jobId]
      properties:
        jobId: { type: integer }
    DeleteInvoiceInput:
      type: object
      properties:
        force:
          type: boolean
          default: false
          description: Delete even though it was sent or paid; any money paid stays on the account as credit
    UncompleteJobInput:
      type: object
      properties:
        sendTo:
          type: string
          enum: [board, waiting_list]
          default: board
          description: Back onto the day it was scheduled, or onto the waiting list with no day
    UncompleteJobResult:
      type: object
      required: [jobId, invoiceId, invoiceVoided]
      properties:
        jobId: { type: integer }
        invoiceId: { type: ["integer", "null"] }
        invoiceNumber: { type: ["integer", "null"] }
        invoiceVoided:
          type: boolean
          description: "true when the job's lines were the whole invoice, so the invoice was voided"
    InvoiceInput:
      type: object
      required: [clientId]
      properties:
        clientId: { type: integer }
        jobId: { type: ["integer", "null"] }
        total:
          type: number
          description: >-
            Ignored when `lines` is supplied — the total is then the sum of the
            lines, so the printed detail and the amount owed cannot disagree.
        notes: { type: string }
        invoiceDate: { type: ["string", "null"] }
        terms:
          type: ["string", "null"]
          description: Defaults to the client's billingTerms when omitted
        poNumber: { type: ["string", "null"] }
        lines:
          type: array
          items:
            $ref: "#/components/schemas/InvoiceLineItemInput"
    InvoiceUpdate:
      type: object
      properties:
        status: { type: string, enum: [open, paid, partial, void] }
        # Lines, notes and dates can all be edited while the invoice is pending;
        # that is what verifying it means.
        total: { type: number }
        notes: { type: ["string", "null"] }
        invoiceDate: { type: ["string", "null"] }
        dueDate: { type: ["string", "null"] }
        terms: { type: ["string", "null"] }
        poNumber: { type: ["string", "null"] }
        lines:
          type: array
          description: When present, replaces every line and recomputes the total
          items:
            $ref: "#/components/schemas/InvoiceLineItemInput"
    SendInvoiceInput:
      type: object
      properties:
        toEmail:
          type: ["string", "null"]
          description: Overrides the client's billing email for this send only
    SendInvoiceResult:
      type: object
      required: [sent, toEmail]
      properties:
        sent: { type: boolean }
        toEmail: { type: string }
        messageId: { type: ["string", "null"] }
    Payment:
      type: object
      required: [id, clientId, amount, method, createdAt]
      properties:
        id: { type: integer }
        clientId: { type: integer }
        clientName: { type: ["string", "null"] }
        invoiceId: { type: ["integer", "null"] }
        invoiceNumber:
          type: ["integer", "null"]
          description: The number of the invoice it is applied to, for the payments list
        jobId: { type: ["integer", "null"] }
        amount: { type: number }
        cardFee: { type: number }
        method: { type: string, enum: [check, venmo, zelle, credit_card, cash, other] }
        reference: { type: ["string", "null"] }
        notes: { type: ["string", "null"] }
        createdAt: { type: string }
    PaymentInput:
      type: object
      required: [clientId, amount, method]
      properties:
        clientId: { type: integer }
        invoiceId: { type: ["integer", "null"] }
        amount: { type: number }
        method: { type: string, enum: [check, venmo, zelle, credit_card, cash, other] }
        reference: { type: string }
        notes: { type: string }
    # ---- GPS (track GPS-SMS) ----
    LocationReport:
      type: object
      required: [lat, lng]
      properties:
        lat: { type: number, minimum: -90, maximum: 90 }
        lng: { type: number, minimum: -180, maximum: 180 }
        accuracyM: { type: ["number", "null"] }
        heading: { type: ["number", "null"] }
        speedMps: { type: ["number", "null"] }
        jobId:
          type: ["integer", "null"]
          description: "The job the phone thinks it is working; ignored unless that job is assigned to the sender"
        recordedAt:
          type: ["string", "null"]
          description: "When the phone took the fix (ISO); server time when omitted"
    TeamLocation:
      type: object
      required: [userId, userName, lat, lng, recordedAt, ageSeconds, source, status]
      properties:
        userId: { type: integer }
        userName: { type: string }
        lat: { type: ["number", "null"] }
        lng: { type: ["number", "null"] }
        accuracyM: { type: ["number", "null"] }
        recordedAt: { type: ["string", "null"] }
        ageSeconds: { type: ["integer", "null"] }
        # live = the phone reported while on a job; clock = the last clock-in/out fix; none = nothing yet
        source: { type: string, enum: [live, clock, none] }
        # at_job = within 150 m of one of their jobs; en_route = has a job going but is not there;
        # idle = no job going; stale = last word is over 10 minutes old; unknown = never reported
        status: { type: string, enum: [at_job, en_route, idle, stale, unknown] }
        jobId: { type: ["integer", "null"] }
        jobStatus: { type: ["string", "null"] }
        jobClientName: { type: ["string", "null"] }
        jobAddress: { type: ["string", "null"] }
    # ---- Texting (track GPS-SMS) ----
    SmsStatus:
      type: object
      required: [configured, provider, officeNumber, myNumber, numbersAssigned, webhookUrl, envKeys]
      properties:
        configured: { type: boolean }
        provider: { type: string, enum: [none, twilio] }
        officeNumber: { type: ["string", "null"] }
        # The caller's own masked number, so a contractor's screen can say where their texts come from
        myNumber: { type: ["string", "null"] }
        numbersAssigned: { type: integer }
        webhookUrl: { type: string }
        envKeys:
          type: array
          items:
            type: object
            required: [key, set, note]
            properties:
              key: { type: string }
              set: { type: boolean }
              note: { type: string }
    SmsMessage:
      type: object
      required: [id, direction, clientId, userId, jobId, fromNumber, toNumber, body, status, createdAt]
      properties:
        id: { type: integer }
        direction: { type: string, enum: [outbound, inbound] }
        clientId: { type: ["integer", "null"] }
        userId: { type: ["integer", "null"] }
        userName: { type: ["string", "null"] }
        jobId: { type: ["integer", "null"] }
        fromNumber: { type: string }
        toNumber: { type: string }
        body: { type: string }
        status: { type: string, enum: [queued, sent, delivered, failed, received, forwarded] }
        error: { type: ["string", "null"] }
        createdAt: { type: string }
    SendSmsInput:
      type: object
      required: [body]
      properties:
        body: { type: string, minLength: 1, maxLength: 1000 }
        # Omit to use the customer's own number
        toPhone: { type: ["string", "null"], maxLength: 40 }
        # Send from this person's masked number instead of the office number, so their reply reaches that person
        fromUserId: { type: ["integer", "null"] }
    JobSmsInput:
      type: object
      required: [body]
      properties:
        body: { type: string, minLength: 1, maxLength: 1000 }
    SendSmsResult:
      type: object
      required: [sent, to, from, messageId]
      properties:
        sent: { type: boolean }
        to: { type: string }
        from: { type: string }
        messageId: { type: integer }
        error: { type: ["string", "null"] }
    SmsNumberInput:
      type: object
      required: [smsProxyNumber]
      properties:
        smsProxyNumber: { type: ["string", "null"], maxLength: 40 }
    InboundSmsInput:
      type: object
      required: [From, To]
      properties:
        From: { type: string }
        To: { type: string }
        Body: { type: string }
        MessageSid: { type: string }
        NumMedia: { type: string }
    # ---- "Crew is on their way" (feedback 49) ----
    OnTheWayNotice:
      type: object
      required: [canSend, reason, sentAt, templateName]
      properties:
        canSend: { type: boolean }
        reason: { type: ["string", "null"], enum: [no_email, do_not_email, already_sent, not_on_the_way, null] }
        sentAt: { type: ["string", "null"] }
        templateName: { type: string }
    OnTheWayNoticeResult:
      type: object
      required: [sent, reason]
      properties:
        sent: { type: boolean }
        reason: { type: ["string", "null"] }
    ClientEmailInput:
      type: object
      required: [subject, body]
      properties:
        subject: { type: string, minLength: 1, maxLength: 200 }
        body: { type: string, minLength: 1, maxLength: 10000 }
        # Who it goes to. Omit toEmail to use the customer's own address, which
        # is what the office wants nearly every time.
        toEmail: { type: string, maxLength: 320 }
        cc: { type: array, maxItems: 10, items: { type: string, maxLength: 320 } }
        bcc: { type: array, maxItems: 10, items: { type: string, maxLength: 320 } }
    ClientEmailResult:
      type: object
      required: [sent, to]
      properties:
        cc: { type: array, items: { type: string } }
        bcc: { type: array, items: { type: string } }
        sent: { type: boolean }
        to: { type: string }
    ApplyPaymentInput:
      type: object
      required: [invoiceId]
      properties:
        invoiceId: { type: integer }
    ApplyPaymentResult:
      type: object
      required: [appliedAmount, remainingCredit]
      properties:
        appliedAmount: { type: number, description: Amount actually applied to the invoice }
        remainingCredit: { type: number, description: Credit left unapplied on the account }
    OfferableService:
      type: object
      required: [id, name, price]
      properties:
        id: { type: integer }
        name: { type: string }
        description: { type: ["string", "null"] }
        price: { type: number }
    ExtraWorkInput:
      type: object
