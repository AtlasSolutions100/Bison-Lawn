      operationId: deleteInvoice
      tags: [invoices]
      summary: >-
        Delete an invoice outright. Refused once it has been sent or paid unless
        force=true, in which case any money paid stays on the account as credit.
        The job it billed goes back to completed-but-not-invoiced.
      parameters:
        - $ref: "#/components/parameters/IdParam"
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DeleteInvoiceInput"
      responses:
        "204":
          description: Deleted
        "409":
          description: Sent or paid; void it instead, or pass force=true
