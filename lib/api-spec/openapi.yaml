        clientId: { type: integer }
        clientName: { type: ["string", "null"] }
        clientAddress: { type: ["string", "null"] }
        clientBalance: { type: ["number", "null"] }
        clientLat: { type: ["number", "null"] }
        clientLng: { type: ["number", "null"] }
        city: { type: ["string", "null"] }
        clientServiceId: { type: ["integer", "null"] }
        serviceId: { type: ["integer", "null"] }
        serviceName: { type: ["string", "null"] }
        status: { type: string, enum: [scheduled, on_the_way, in_progress, completed] }
        dispatched: { type: boolean }
        scheduledDate: { type: ["string", "null"] }
        windowStart: { type: ["string", "null"] }
        windowEnd: { type: ["string", "null"] }
        routeOrder: { type: ["integer", "null"] }
        assignedToId: { type: ["integer", "null"] }
        assignedToName: { type: ["string", "null"] }
        mapNote: { type: ["string", "null"] }
        lastServiceDate: { type: ["string", "null"] }
        budgetedHours: { type: ["number", "null"] }
        amount: { type: number }
        notes: { type: ["string", "null"] }
        notesImportant: { type: ["boolean", "null"] }
        visibleToContractor: { type: ["boolean", "null"] }
        products:
          type: array
          items:
            $ref: "#/components/schemas/JobProduct"
        invoiceId: { type: ["integer", "null"] }
        completedAt: { type: ["string", "null"] }
    JobInput:
      type: object
      required: [clientId, amount]
      properties:
        clientId: { type: integer }
        serviceId: { type: ["integer", "null"] }
        clientServiceId: { type: ["integer", "null"] }
        scheduledDate: { type: ["string", "null"] }
        windowStart: { type: ["string", "null"] }
        windowEnd: { type: ["string", "null"] }
        assignedToId: { type: ["integer", "null"] }
        amount: { type: number }
        budgetedHours: { type: ["number", "null"] }
        mapNote: { type: ["string", "null"] }
        notes: { type: ["string", "null"] }
        notesImportant: { type: boolean }
    JobUpdate:
      type: object
      properties:
        status: { type: string, enum: [scheduled, on_the_way, in_progress, completed] }
        scheduledDate: { type: ["string", "null"] }
        routeOrder: { type: ["integer", "null"] }
        assignedToId: { type: ["integer", "null"] }
        amount: { type: number }
        budgetedHours: { type: ["number", "null"] }
        mapNote: { type: ["string", "null"] }
        notes: { type: ["string", "null"] }
        notesImportant: { type: boolean }
        visibleToContractor: { type: boolean }
    DispatchInput:
      type: object
      required: [jobIds, date]
      properties:
        jobIds:
          type: array
          items: { type: integer }
        date: { type: string }
        assignedToId: { type: ["integer", "null"] }
    RouteStop:
      type: object
      required: [order, type, name, hasCoordinates]
      properties:
        order: { type: integer }
        type: { type: string, enum: [base, job] }
        jobId: { type: ["integer", "null"] }
        name: { type: string }
        clientName: { type: ["string", "null"] }
        address: { type: ["string", "null"] }
        lat: { type: ["number", "null"] }
        lng: { type: ["number", "null"] }
        distanceToNextKm: { type: ["number", "null"] }
        hasCoordinates: { type: boolean }
    RouteResult:
      type: object
      required: [stops, totalDistanceKm, optimized]
      properties:
        stops:
          type: array
          items:
            $ref: "#/components/schemas/RouteStop"
        totalDistanceKm: { type: number }
        baseAddress: { type: ["string", "null"] }
        optimized: { type: boolean }
    Invoice:
      type: object
      required: [id, clientId, status, total, amountPaid, createdAt]
