openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: Bison Lawn Care CRM API
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
  - name: auth
  - name: clients
  - name: services
  - name: packages
  - name: estimates
  - name: jobs
  - name: invoices
  - name: payments
  - name: tickets
  - name: team
  - name: dashboard
  - name: fieldNotes
  - name: automation
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /me:
    get:
      operationId: getCurrentUser
      tags: [auth]
      summary: Current authenticated app user (provisioned on first call)
      responses:
        "200":
          description: Current user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AppUser"
  /users:
    get:
      operationId: listUsers
      tags: [team]
      summary: List team members (admins and contractors)
      responses:
        "200":
          description: Users
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AppUser"
  /users/{id}:
    patch:
      operationId: updateUser
      tags: [team]
      summary: Update a user's role, name, or base location
      parameters:
        - $ref: "#/components/parameters/IdParam"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AppUserUpdate"
      responses:
        "200":
          description: Updated user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AppUser"
  /clients:
    get:
      operationId: listClients
      tags: [clients]
      summary: List clients/leads with optional filters
      parameters:
        - name: status
          in: query
          schema: { type: string, enum: [lead, client, former_client] }
        - name: search
          in: query
          schema: { type: string }
      responses:
        "200":
          description: Clients
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Client"
    post:
      operationId: createClient
      tags: [clients]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ClientInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Client"
  /clients/{id}:
    get:
      operationId: getClient
      tags: [clients]
      parameters:
        - $ref: "#/components/parameters/IdParam"
      responses:
        "200":
          description: Client
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Client"
    patch:
      operationId: updateClient
      tags: [clients]
      parameters:
        - $ref: "#/components/parameters/IdParam"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ClientUpdate"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Client"
    delete:
      operationId: deleteClient
      tags: [clients]
      parameters:
        - $ref: "#/components/parameters/IdParam"
      responses:
        "204":
          description: Deleted
  /clients/{id}/notes:
    get:
      operationId: listClientNotes
      tags: [clients]
      parameters:
        - $ref: "#/components/parameters/IdParam"
      responses:
        "200":
          description: Notes
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ClientNote"
    post:
      operationId: createClientNote
      tags: [clients]
      parameters:
        - $ref: "#/components/parameters/IdParam"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ClientNoteInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ClientNote"
  /clients/{id}/audit:
    get:
      operationId: listClientAudit
      tags: [clients]
      summary: Lazy-loaded audit trail for a client, newest first
      parameters:
        - $ref: "#/components/parameters/IdParam"
      responses:
        "200":
          description: Audit events
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AuditEvent"
  /clients/{id}/client-services:
    get:
      operationId: listClientServices
      tags: [clients]
      summary: Services/packages assigned to a client
      parameters:
        - $ref: "#/components/parameters/IdParam"
      responses:
        "200":
          description: Client services
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ClientService"
    post:
      operationId: createClientService
      tags: [clients]
      summary: Assign a service or package to a client (creates jobs / waiting-list entries)
      parameters:
        - $ref: "#/components/parameters/IdParam"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ClientServiceInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ClientService"
  /client-services/{id}:
    patch:
      operationId: updateClientService
      tags: [clients]
      parameters:
        - $ref: "#/components/parameters/IdParam"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ClientServiceUpdate"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ClientService"
    delete:
      operationId: deleteClientService
      tags: [clients]
      parameters:
        - $ref: "#/components/parameters/IdParam"
      responses:
        "204":
          description: Deleted
  /services:
    get:
      operationId: listServices
      tags: [services]
      responses:
        "200":
          description: Services
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Service"
    post:
      operationId: createService
      tags: [services]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ServiceInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Service"
  /services/{id}:
    get:
      operationId: getService
      tags: [services]
      parameters:
        - $ref: "#/components/parameters/IdParam"
      responses:
        "200":
          description: Service
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Service"
    patch:
      operationId: updateService
      tags: [services]
      parameters:
        - $ref: "#/components/parameters/IdParam"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ServiceUpdate"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Service"
    delete:
      operationId: deleteService
      tags: [services]
      parameters:
        - $ref: "#/components/parameters/IdParam"
      responses:
        "204":
          description: Deleted
  /services/{id}/price:
    post:
      operationId: calculateServicePrice
      tags: [services]
      summary: Live price calculator for a service given square footage
      parameters:
        - $ref: "#/components/parameters/IdParam"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PriceQueryInput"
      responses:
        "200":
          description: Calculated price
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PriceResult"
  /packages:
    get:
      operationId: listPackages
      tags: [packages]
      responses:
        "200":
          description: Packages
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ServicePackage"
    post:
      operationId: createPackage
      tags: [packages]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ServicePackageInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ServicePackage"
  /packages/{id}:
    patch:
      operationId: updatePackage
      tags: [packages]
      parameters:
        - $ref: "#/components/parameters/IdParam"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ServicePackageUpdate"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ServicePackage"
    delete:
      operationId: deletePackage
      tags: [packages]
      parameters:
        - $ref: "#/components/parameters/IdParam"
      responses:
        "204":
          description: Deleted
  /estimate-fields:
    get:
      operationId: listEstimateFields
      tags: [estimates]
      responses:
        "200":
          description: Estimate custom fields
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/EstimateField"
    post:
      operationId: createEstimateField
      tags: [estimates]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EstimateFieldInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EstimateField"
  /estimate-fields/{id}:
    patch:
      operationId: updateEstimateField
      tags: [estimates]
      parameters:
        - $ref: "#/components/parameters/IdParam"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EstimateFieldUpdate"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EstimateField"
    delete:
      operationId: deleteEstimateField
      tags: [estimates]
      parameters:
        - $ref: "#/components/parameters/IdParam"
      responses:
        "204":
          description: Deleted
  /estimates:
    get:
      operationId: listEstimates
      tags: [estimates]
      parameters:
        - name: clientId
          in: query
          schema: { type: integer }
      responses:
        "200":
          description: Estimates
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Estimate"
    post:
      operationId: createEstimate
      tags: [estimates]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EstimateInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Estimate"
  /estimates/{id}:
    get:
      operationId: getEstimate
      tags: [estimates]
      parameters:
        - $ref: "#/components/parameters/IdParam"
      responses:
        "200":
          description: Estimate
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Estimate"
    patch:
      operationId: updateEstimate
      tags: [estimates]
      summary: Edit a draft estimate's lines and notes; sent/accepted/declined stay immutable
      parameters:
        - $ref: "#/components/parameters/IdParam"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EstimateUpdateInput"
      responses:
        "200":
          description: Updated estimate
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Estimate"
    delete:
      operationId: deleteEstimate
      tags: [estimates]
      parameters:
        - $ref: "#/components/parameters/IdParam"
      responses:
        "204":
          description: Deleted
  /estimates/{id}/pdf:
    get:
      operationId: downloadEstimatePdf
      tags: [estimates]
      summary: Download a customer-ready estimate PDF
      parameters:
        - $ref: "#/components/parameters/IdParam"
      responses:
        "200":
          description: Estimate PDF
          content:
            application/pdf:
              schema:
                type: string
                format: binary
  /estimates/{id}/send:
    post:
      operationId: sendEstimate
      tags: [estimates]
      summary: Email an estimate PDF and secure response links through Gmail
      parameters:
        - $ref: "#/components/parameters/IdParam"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EstimateSendInput"
      responses:
        "200":
          description: Sent
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Estimate"
  /estimates/{id}/reconcile-delivery:
    post:
      operationId: reconcileEstimateDelivery
      tags: [estimates]
      summary: Finalize a Gmail-accepted delivery without sending a duplicate
      parameters:
        - $ref: "#/components/parameters/IdParam"
      responses:
        "200":
          description: Reconciled estimate
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Estimate"
  /waiting-list:
    get:
      operationId: listWaitingList
      tags: [jobs]
      summary: Jobs with date windows not yet dispatched; filter by date range
      parameters:
        - name: date
          in: query
          schema: { type: string }
        - name: from
          in: query
          schema: { type: string }
        - name: to
          in: query
          schema: { type: string }
      responses:
        "200":
          description: Waiting list jobs
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Job"
  /jobs:
    get:
      operationId: listJobs
      tags: [jobs]
      summary: Dispatch board jobs with heavy filtering
      parameters:
        - name: date
          in: query
          schema: { type: string }
        - name: from
          in: query
          schema: { type: string }
        - name: to
          in: query
          schema: { type: string }
        - name: assignedTo
          in: query
          schema: { type: integer }
        - name: status
          in: query
          schema: { type: string, enum: [scheduled, on_the_way, in_progress, completed] }
        - name: city
          in: query
          schema: { type: string }
        - name: serviceId
          in: query
          schema: { type: integer }
        - name: clientId
          in: query
          schema: { type: integer }
      responses:
        "200":
          description: Jobs
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Job"
    post:
      operationId: createJob
      tags: [jobs]
      summary: Create a one-off job directly on the board
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/JobInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Job"
  /jobs/{id}:
    get:
      operationId: getJob
      tags: [jobs]
      parameters:
        - $ref: "#/components/parameters/IdParam"
      responses:
        "200":
          description: Job
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Job"
    patch:
      operationId: updateJob
      tags: [jobs]
      summary: Update job fields (status, order, date, assignment, notes, map note, hours)
      parameters:
        - $ref: "#/components/parameters/IdParam"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/JobUpdate"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Job"
    delete:
      operationId: deleteJob
      tags: [jobs]
      parameters:
        - $ref: "#/components/parameters/IdParam"
      responses:
        "204":
          description: Deleted
  /jobs/dispatch:
    post:
      operationId: dispatchJobs
      tags: [jobs]
      summary: Multi-select dispatch waiting-list jobs to a concrete date
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DispatchInput"
      responses:
        "200":
          description: Dispatched jobs
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Job"
  /jobs/{id}/complete:
    post:
      operationId: completeJob
      tags: [jobs]
      summary: Mark a job completed and generate its invoice
      parameters:
        - $ref: "#/components/parameters/IdParam"
      responses:
        "200":
          description: Completed job with invoice
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Job"
  /jobs/{id}/products:
    post:
      operationId: addJobProduct
      tags: [jobs]
      summary: Add a product/part with price to a job
      parameters:
        - $ref: "#/components/parameters/IdParam"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/JobProductInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JobProduct"
  /job-products/{id}:
    delete:
      operationId: deleteJobProduct
      tags: [jobs]
      parameters:
        - $ref: "#/components/parameters/IdParam"
      responses:
        "204":
          description: Deleted
  /my/jobs:
    get:
      operationId: listMyJobs
      tags: [jobs]
      summary: Contractor's own assigned jobs, optionally by date
      parameters:
        - name: date
          in: query
          schema: { type: string }
        - name: from
          in: query
          schema: { type: string }
        - name: to
          in: query
          schema: { type: string }
      responses:
        "200":
          description: Jobs assigned to the current user
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Job"
  /my/offerable-services:
    get:
      operationId: listOfferableServices
      tags: [jobs]
      summary: One-time extra services the office allows contractors to offer on site
      responses:
        "200":
          description: Offerable services with contractor-facing prices
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/OfferableService"
  /my/jobs/{id}/extra-work:
    post:
      operationId: addExtraWork
      tags: [jobs]
      summary: Add approved one-time extra work to an assigned job from the field
      parameters:
        - $ref: "#/components/parameters/IdParam"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ExtraWorkInput"
      responses:
        "201":
          description: Extra work added as a job line item
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JobProduct"
  /my/jobs/{id}/payments:
    post:
      operationId: recordOnSitePayment
      tags: [payments]
      summary: Record an on-site payment for an assigned job; card fee applied per office settings
      parameters:
        - $ref: "#/components/parameters/IdParam"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OnSitePaymentInput"
      responses:
        "201":
          description: Recorded payment with fee breakdown
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OnSitePayment"
  /billing-settings:
    get:
      operationId: getBillingSettings
      tags: [payments]
      summary: Card processing fee configuration (visible to all authenticated users)
      responses:
        "200":
          description: Billing settings
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BillingSettings"
    patch:
      operationId: updateBillingSettings
      tags: [payments]
      summary: Update card processing fee configuration (admin only)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BillingSettingsUpdate"
      responses:
        "200":
          description: Updated billing settings
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BillingSettings"
  /my/route:
    get:
      operationId: getMyRoute
      tags: [jobs]
      summary: Efficient route for the contractor's jobs on a date from home base
      parameters:
        - name: date
          in: query
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Ordered route
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RouteResult"
  /invoices:
    get:
      operationId: listInvoices
      tags: [invoices]
      parameters:
        - name: clientId
          in: query
          schema: { type: integer }
        - name: status
          in: query
          schema: { type: string, enum: [open, paid, partial, void] }
      responses:
        "200":
          description: Invoices
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Invoice"
    post:
      operationId: createInvoice
      tags: [invoices]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/InvoiceInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Invoice"
  /invoices/{id}:
    get:
      operationId: getInvoice
      tags: [invoices]
      parameters:
        - $ref: "#/components/parameters/IdParam"
      responses:
        "200":
          description: Invoice
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Invoice"
    patch:
      operationId: updateInvoice
      tags: [invoices]
      parameters:
        - $ref: "#/components/parameters/IdParam"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/InvoiceUpdate"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Invoice"
  /payments:
    get:
      operationId: listPayments
      tags: [payments]
      parameters:
        - name: clientId
          in: query
          schema: { type: integer }
      responses:
        "200":
          description: Payments
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Payment"
    post:
      operationId: createPayment
      tags: [payments]
      summary: Record a manual payment; applies to invoice and updates balance
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PaymentInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Payment"
  /payments/{id}:
    delete:
      operationId: deletePayment
      tags: [payments]
      parameters:
        - $ref: "#/components/parameters/IdParam"
      responses:
        "204":
          description: Deleted
  /tickets:
    get:
      operationId: listTickets
      tags: [tickets]
      parameters:
        - name: clientId
          in: query
          schema: { type: integer }
        - name: assignedTo
          in: query
          schema: { type: integer }
        - name: status
          in: query
          schema: { type: string, enum: [open, done] }
      responses:
        "200":
          description: Tickets
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Ticket"
    post:
      operationId: createTicket
      tags: [tickets]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TicketInput"
