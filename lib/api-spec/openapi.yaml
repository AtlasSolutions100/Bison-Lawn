          items: { type: integer }
          description: "Indexes into lines the customer accepted. Null means every line."
        acceptedTotal: { type: ["number", "null"] }
        deliveryAttempts: { type: integer }
        deliveryState: { type: string, enum: [idle, sending, provider_accepted, sent, failed] }
        providerAcceptedAt: { type: ["string", "null"] }
        lastDeliveryError: { type: ["string", "null"] }
        gmailMessageId: { type: ["string", "null"] }
        propertyDataUpdated:
          type: array
          description: "Property detail labels written back to the client on create; empty when nothing changed"
          items: { type: string }
    EstimateInput:
      type: object
      required: [clientId, lines]
      properties:
        clientId: { type: integer }
        notes: { type: string }
