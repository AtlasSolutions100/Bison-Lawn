      properties:
        id: { type: integer }
        jobId: { type: integer }
        name: { type: string }
        price: { type: number }
        quantity: { type: number }
        serviceId: { type: ["integer", "null"] }
    JobProductInput:
      type: object
      required: [name, price]
      properties:
        name: { type: string, minLength: 1 }
        price: { type: number }
        quantity: { type: number }
    Job:
