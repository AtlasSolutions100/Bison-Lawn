      properties:
        id: { type: integer }
        clientId: { type: integer }
        clientName: { type: ["string", "null"] }
        version: { type: integer, description: "Increments on every accepted edit; send it back with PATCH to detect concurrent edits" }
        status: { type: string, enum: [draft, sent, accepted, declined] }
        total: { type: number }
        notes: { type: ["string", "null"] }
        coverNote: { type: ["string", "null"] }
        includeServiceDescriptions: { type: boolean }
