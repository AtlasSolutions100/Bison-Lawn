      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FieldNoteInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FieldNote"
  /field-notes:
    get:
      operationId: listFieldNotes
      tags: [fieldNotes]
      summary: List field notes (admin)
      parameters:
        - name: jobId
          in: query
          schema: { type: integer }
        - name: clientId
          in: query
          schema: { type: integer }
      responses:
        "200":
          description: Field notes
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/FieldNote"
  /weather-rules:
    get:
      operationId: listWeatherRules
      tags: [automation]
      responses:
        "200":
          description: Weather rules
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/WeatherRule"
    post:
      operationId: createWeatherRule
      tags: [automation]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WeatherRuleInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WeatherRule"
  /weather-rules/{id}:
    patch:
      operationId: updateWeatherRule
      tags: [automation]
      parameters:
        - $ref: "#/components/parameters/IdParam"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WeatherRuleUpdate"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WeatherRule"
    delete:
      operationId: deleteWeatherRule
      tags: [automation]
      parameters:
        - $ref: "#/components/parameters/IdParam"
      responses:
        "204":
          description: Deleted
  /weather-check:
    post:
      operationId: runWeatherCheck
      tags: [automation]
      summary: Evaluate enabled weather rules against scheduled jobs for a date and prepare suggested actions
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WeatherCheckInput"
      responses:
        "200":
          description: Check result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WeatherCheckResult"
  /suggested-actions:
    get:
      operationId: listSuggestedActions
      tags: [automation]
      parameters:
        - name: status
          in: query
          schema: { type: string, enum: [pending, approved, rejected] }
      responses:
        "200":
          description: Suggested actions
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/SuggestedAction"
  /suggested-actions/{id}:
    patch:
      operationId: updateSuggestedAction
      tags: [automation]
      summary: Edit a pending suggestion (message, new date) before approval
      parameters:
        - $ref: "#/components/parameters/IdParam"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SuggestedActionUpdate"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuggestedAction"
  /suggested-actions/{id}/approve:
    post:
      operationId: approveSuggestedAction
      tags: [automation]
      summary: Approve and apply a suggested action (admin)
      parameters:
        - $ref: "#/components/parameters/IdParam"
      responses:
        "200":
          description: Approved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuggestedAction"
  /suggested-actions/{id}/resend-message:
    post:
      operationId: resendSuggestedActionMessage
      tags: [automation]
      summary: Retry emailing the approved customer message after a failed or unsent delivery (admin)
      parameters:
        - $ref: "#/components/parameters/IdParam"
      responses:
        "200":
          description: Resend attempted; the returned delivery state says whether it reached the customer
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuggestedAction"
  /suggested-actions/{id}/reject:
    post:
      operationId: rejectSuggestedAction
      tags: [automation]
      summary: Reject a suggested action (admin)
      parameters:
        - $ref: "#/components/parameters/IdParam"
      responses:
        "200":
          description: Rejected
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuggestedAction"
  /dashboard/summary:
    get:
      operationId: getDashboardSummary
      tags: [dashboard]
      summary: Admin dashboard totals
      responses:
        "200":
          description: Summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DashboardSummary"
  /dashboard/activity:
    get:
      operationId: getRecentActivity
      tags: [dashboard]
      summary: Recent audit events across the whole system
      responses:
        "200":
          description: Recent activity
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AuditEvent"
  /dashboard/contractor-earnings:
    get:
      operationId: getContractorEarnings
      tags: [dashboard]
      summary: Per-contractor job totals for a date (what each contractor is owed)
      parameters:
        - name: date
          in: query
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Earnings per contractor
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ContractorEarnings"
components:
  parameters:
    IdParam:
      name: id
      in: path
      required: true
      schema:
        type: integer
  schemas:
    HealthStatus:
      type: object
      properties:
        status: { type: string }
      required: [status]
    AppUser:
      type: object
      required: [id, clerkId, name, role]
      properties:
        id: { type: integer }
        clerkId: { type: string }
        name: { type: string }
        email: { type: ["string", "null"] }
        role: { type: string, enum: [admin, contractor] }
        phone: { type: ["string", "null"] }
        baseAddress: { type: ["string", "null"] }
        baseLat: { type: ["number", "null"] }
        baseLng: { type: ["number", "null"] }
    AppUserUpdate:
      type: object
      properties:
        name: { type: string }
        role: { type: string, enum: [admin, contractor] }
        phone: { type: ["string", "null"] }
        baseAddress: { type: ["string", "null"] }
        baseLat: { type: ["number", "null"] }
        baseLng: { type: ["number", "null"] }
    Client:
      type: object
      required: [id, name, status, accountBalance]
      properties:
        id: { type: integer }
        name: { type: string }
        status: { type: string, enum: [lead, client, former_client] }
        serviceAddress: { type: ["string", "null"] }
        city: { type: ["string", "null"] }
        lat: { type: ["number", "null"] }
        lng: { type: ["number", "null"] }
        accountBalance: { type: number }
        email: { type: ["string", "null"] }
        phone: { type: ["string", "null"] }
        additionalContact: { type: ["string", "null"] }
        mapNote: { type: ["string", "null"] }
        propertyData:
          type: object
          additionalProperties: { type: string }
        lastServiceDate: { type: ["string", "null"] }
        createdAt: { type: string }
    ClientInput:
      type: object
      required: [name]
      properties:
        name: { type: string, minLength: 1 }
        status: { type: string, enum: [lead, client, former_client] }
        serviceAddress: { type: string }
        city: { type: string }
        lat: { type: number }
        lng: { type: number }
        email: { type: string }
        phone: { type: string }
        additionalContact: { type: string }
        mapNote: { type: string }
        propertyData:
          type: object
          additionalProperties: { type: string }
    ClientUpdate:
      type: object
      properties:
        name: { type: string, minLength: 1 }
        status: { type: string, enum: [lead, client, former_client] }
        serviceAddress: { type: ["string", "null"] }
        city: { type: ["string", "null"] }
        lat: { type: ["number", "null"] }
        lng: { type: ["number", "null"] }
        email: { type: ["string", "null"] }
        phone: { type: ["string", "null"] }
        additionalContact: { type: ["string", "null"] }
        mapNote: { type: ["string", "null"] }
        propertyData:
          type: object
          additionalProperties: { type: string }
    ClientNote:
      type: object
      required: [id, clientId, body, createdAt]
      properties:
        id: { type: integer }
        clientId: { type: integer }
        body: { type: string }
        authorName: { type: ["string", "null"] }
        createdAt: { type: string }
    ClientNoteInput:
      type: object
      required: [body]
      properties:
        body: { type: string, minLength: 1 }
    AuditEvent:
      type: object
      required: [id, action, description, createdAt]
      properties:
        id: { type: integer }
        clientId: { type: ["integer", "null"] }
        clientName: { type: ["string", "null"] }
        actorName: { type: ["string", "null"] }
        action: { type: string }
        description: { type: string }
        createdAt: { type: string }
    PricingEquation:
      type: object
      required: [upToSqft, basePrice, baseSqft, incrementPrice, incrementSqft]
      properties:
        upToSqft: { type: ["number", "null"], description: "Breakpoint; null = no upper bound" }
        basePrice: { type: number }
        baseSqft: { type: number, description: "Base price covers the first N sqft" }
        incrementPrice: { type: number }
        incrementSqft: { type: number, description: "Additional price per N sqft, rounded up" }
    Service:
      type: object
      required: [id, name, quantity, rate]
      properties:
        id: { type: integer }
        name: { type: string }
        description: { type: ["string", "null"] }
        quantity: { type: number }
        rate: { type: number }
        billableHours: { type: ["number", "null"] }
        teamSize: { type: ["integer", "null"] }
        minDays: { type: ["integer", "null"] }
        defaultStartDate: { type: ["string", "null"] }
        defaultEndDate: { type: ["string", "null"] }
        renewDate: { type: ["string", "null"] }
        pricingEquations:
          type: array
          items:
            $ref: "#/components/schemas/PricingEquation"
        contractorOfferable: { type: boolean }
        contractorPrice: { type: ["number", "null"] }
    ServiceInput:
      type: object
      required: [name]
      properties:
        name: { type: string, minLength: 1 }
        description: { type: string }
        quantity: { type: number }
        rate: { type: number }
        billableHours: { type: ["number", "null"] }
        teamSize: { type: ["integer", "null"] }
        minDays: { type: ["integer", "null"] }
        defaultStartDate: { type: ["string", "null"] }
        defaultEndDate: { type: ["string", "null"] }
        renewDate: { type: ["string", "null"] }
        pricingEquations:
          type: array
          items:
            $ref: "#/components/schemas/PricingEquation"
        contractorOfferable: { type: boolean }
        contractorPrice: { type: ["number", "null"] }
    ServiceUpdate:
      type: object
      properties:
        name: { type: string, minLength: 1 }
        description: { type: ["string", "null"] }
        quantity: { type: number }
        rate: { type: number }
        billableHours: { type: ["number", "null"] }
        teamSize: { type: ["integer", "null"] }
        minDays: { type: ["integer", "null"] }
        defaultStartDate: { type: ["string", "null"] }
        defaultEndDate: { type: ["string", "null"] }
        renewDate: { type: ["string", "null"] }
        pricingEquations:
          type: array
          items:
            $ref: "#/components/schemas/PricingEquation"
        contractorOfferable: { type: boolean }
        contractorPrice: { type: ["number", "null"] }
    PriceQueryInput:
      type: object
      required: [sqft]
      properties:
        sqft: { type: number }
    PriceResult:
      type: object
      required: [price, sqft]
      properties:
        price: { type: number }
        sqft: { type: number }
        equationIndex: { type: ["integer", "null"] }
    ServicePackage:
      type: object
      required: [id, name, serviceIds]
      properties:
        id: { type: integer }
        name: { type: string }
        description: { type: ["string", "null"] }
        serviceIds:
          type: array
          items: { type: integer }
        services:
          type: array
          items:
            $ref: "#/components/schemas/Service"
    ServicePackageInput:
      type: object
      required: [name, serviceIds]
      properties:
        name: { type: string, minLength: 1 }
        description: { type: string }
        serviceIds:
          type: array
          items: { type: integer }
    ServicePackageUpdate:
      type: object
      properties:
        name: { type: string, minLength: 1 }
        description: { type: ["string", "null"] }
        serviceIds:
          type: array
          items: { type: integer }
    ClientService:
      type: object
      required: [id, clientId, serviceId, quantity, amount, scheduleType]
      properties:
        id: { type: integer }
        clientId: { type: integer }
        serviceId: { type: integer }
        serviceName: { type: ["string", "null"] }
        packageId: { type: ["integer", "null"] }
        packageName: { type: ["string", "null"] }
        quantity: { type: number }
        amount: { type: number }
        scheduleType: { type: string, enum: [window, recurring, one_time] }
        startDate: { type: ["string", "null"] }
        endDate: { type: ["string", "null"] }
        frequencyWeeks: { type: ["integer", "null"] }
        firstServiceDate: { type: ["string", "null"] }
        seasonEndDate: { type: ["string", "null"] }
        renewDate: { type: ["string", "null"] }
        budgetedHours: { type: ["number", "null"] }
    ClientServiceInput:
      type: object
      required: [scheduleType]
      properties:
        serviceId: { type: ["integer", "null"] }
        packageId: { type: ["integer", "null"], description: "Provide packageId to add every service in the package" }
        quantity: { type: number }
        amount: { type: ["number", "null"], description: "Override; defaults to engine-calculated or service rate" }
        sqft: { type: ["number", "null"], description: "Used with pricing equations to compute amount" }
        scheduleType: { type: string, enum: [window, recurring, one_time] }
        startDate: { type: ["string", "null"] }
        endDate: { type: ["string", "null"] }
        frequencyWeeks: { type: ["integer", "null"] }
        firstServiceDate: { type: ["string", "null"] }
        seasonEndDate: { type: ["string", "null"] }
        renewDate: { type: ["string", "null"] }
        budgetedHours: { type: ["number", "null"] }
    ClientServiceUpdate:
      type: object
      properties:
        quantity: { type: number }
        amount: { type: number }
        startDate: { type: ["string", "null"] }
        endDate: { type: ["string", "null"] }
        frequencyWeeks: { type: ["integer", "null"] }
        firstServiceDate: { type: ["string", "null"] }
        seasonEndDate: { type: ["string", "null"] }
        renewDate: { type: ["string", "null"] }
        budgetedHours: { type: ["number", "null"] }
    EstimateField:
      type: object
      required: [id, label, fieldType]
      properties:
        id: { type: integer }
        label: { type: string }
        fieldType: { type: string, enum: [calculable, text, number, boolean] }
        pricePerUnit: { type: ["number", "null"] }
        unitSize: { type: ["number", "null"], description: "e.g. $20 per 100 sqft => pricePerUnit 20, unitSize 100" }
        sortOrder: { type: ["integer", "null"] }
    EstimateFieldInput:
      type: object
      required: [label, fieldType]
      properties:
        label: { type: string, minLength: 1 }
        fieldType: { type: string, enum: [calculable, text, number, boolean] }
        pricePerUnit: { type: ["number", "null"] }
        unitSize: { type: ["number", "null"] }
        sortOrder: { type: ["integer", "null"] }
    EstimateFieldUpdate:
      type: object
      properties:
        label: { type: string, minLength: 1 }
        fieldType: { type: string, enum: [calculable, text, number, boolean] }
        pricePerUnit: { type: ["number", "null"] }
        unitSize: { type: ["number", "null"] }
        sortOrder: { type: ["integer", "null"] }
    EstimateLine:
      type: object
      description: >-
        A line on an estimate. With a fieldId or serviceId the price is computed server-side from that
        definition; with neither it is a custom one-off charge (haul-away, dump fee, discount) whose
        label and submitted price are validated and kept as entered.
      required: [label, value]
      properties:
        fieldId: { type: ["integer", "null"], description: "Reference to a reusable estimate field" }
        serviceId: { type: ["integer", "null"], description: "Reference to a service priced by its equations" }
        label: { type: string }
        value: { type: string, description: "Entered value for field/service lines, optional description for custom lines" }
        calculatedPrice:
          type: ["number", "null"]
          description: "Server-computed for field/service lines; required and kept as submitted for custom lines"
    Estimate:
      type: object
      required: [id, clientId, status, total, lines, createdAt, deliveryAttempts, deliveryState]
      properties:
        id: { type: integer }
        clientId: { type: integer }
        clientName: { type: ["string", "null"] }
        status: { type: string, enum: [draft, sent, accepted, declined] }
        total: { type: number }
        notes: { type: ["string", "null"] }
        lines:
          type: array
          items:
            $ref: "#/components/schemas/EstimateLine"
        createdAt: { type: string }
        sentAt: { type: ["string", "null"] }
        sentToEmail: { type: ["string", "null"] }
        respondedAt: { type: ["string", "null"] }
        deliveryAttempts: { type: integer }
        deliveryState: { type: string, enum: [idle, sending, provider_accepted, sent, failed] }
        providerAcceptedAt: { type: ["string", "null"] }
        lastDeliveryError: { type: ["string", "null"] }
        gmailMessageId: { type: ["string", "null"] }
        propertyDataUpdated:
          type: array
          description: "Property detail labels written back to the client on create; empty when nothing changed"
          items: { type: string }
    EstimateInput:
      type: object
      required: [clientId, lines]
      properties:
        clientId: { type: integer }
        notes: { type: string }
        savePropertyData:
          type: boolean
          description: "Write the entered field values back to the client's saved property details, matched by field label"
        lines:
          type: array
          items:
            $ref: "#/components/schemas/EstimateLine"
    EstimateUpdateInput:
      type: object
      required: [lines]
      properties:
        notes: { type: ["string", "null"] }
        lines:
          type: array
          items:
            $ref: "#/components/schemas/EstimateLine"
    EstimateSendInput:
      type: object
      required: [toEmail]
      properties:
        toEmail: { type: string, format: email }
        message: { type: string }
    JobProduct:
