      type: object
      required: [id, clerkId, name, role, active, accessLevel, permissions, areas]
      properties:
        id: { type: integer }
        clerkId: { type: string }
        # The name to show everywhere: the display name if Adam set one, else the sign-in name
        name: { type: string }
        # The name the sign-in gave us, kept so the Team page can show both
        fullName: { type: string }
        displayName: { type: ["string", "null"] }
        email: { type: ["string", "null"] }
