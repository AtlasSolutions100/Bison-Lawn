        date: { type: string }
        jobsChecked: { type: integer }
        suggestionsCreated: { type: integer }
        forecastSummary: { type: ["string", "null"] }
        suggestions:
          type: array
          items:
            $ref: "#/components/schemas/SuggestedAction"
    WeatherCheckRun:
      type: object
      required: [id, trigger, status, datesChecked, jobsChecked, suggestionsCreated, startedAt]
      properties:
        id: { type: integer }
        trigger: { type: string, enum: [scheduled, manual] }
        status: { type: string, enum: [running, succeeded, failed] }
        datesChecked:
          type: array
          items: { type: string }
        jobsChecked: { type: integer }
        suggestionsCreated: { type: integer }
        summary: { type: ["string", "null"] }
        error: { type: ["string", "null"] }
        triggeredBy: { type: ["string", "null"] }
        startedAt: { type: string }
        finishedAt: { type: ["string", "null"] }
    WeatherCheckStatus:
      type: object
      required: [enabled, runAtLocalTime, timeZone, daysAhead]
      properties:
        enabled: { type: boolean }
        runAtLocalTime: { type: string }
        timeZone: { type: string }
        daysAhead: { type: integer }
        nextRunAt: { type: ["string", "null"] }
        lastAutomaticRun:
          oneOf:
            - $ref: "#/components/schemas/WeatherCheckRun"
            - type: "null"
        lastManualRun:
          oneOf:
            - $ref: "#/components/schemas/WeatherCheckRun"
            - type: "null"
    SuggestedAction:
      type: object
      required: [id, source, clientId, actionType, reason, status, messageDeliveryState, createdAt]
      properties:
        id: { type: integer }
        source: { type: string, enum: [weather, field_note] }
        ruleId: { type: ["integer", "null"] }
        ruleName: { type: ["string", "null"] }
        jobId: { type: ["integer", "null"] }
        clientId: { type: integer }
        clientName: { type: ["string", "null"] }
        actionType: { type: string, enum: [skip, reschedule] }
        reason: { type: string }
        targetDate: { type: ["string", "null"] }
        newDate: { type: ["string", "null"] }
        customerMessage: { type: ["string", "null"] }
        status: { type: string, enum: [pending, approved, rejected] }
        clientEmail: { type: ["string", "null"] }
        messageDeliveryState:
          type: string
          # "sending" is a live claim; "abandoned" is a claim that never reported an outcome
          enum: [pending_review, not_applicable, no_email, sending, abandoned, sent, failed]
        messageDeliveryClaimedAt: { type: ["string", "null"] }
        messageSentToEmail: { type: ["string", "null"] }
        messageSentAt: { type: ["string", "null"] }
        messageDeliveryError: { type: ["string", "null"] }
        reviewedById: { type: ["integer", "null"] }
        reviewedByName: { type: ["string", "null"] }
        reviewedAt: { type: ["string", "null"] }
        createdAt: { type: string }
    SuggestedActionUpdate:
      type: object
      properties:
        newDate: { type: ["string", "null"] }
        customerMessage: { type: ["string", "null"] }
    DashboardSummary:
      type: object
      required: [leadCount, clientCount, jobsToday, jobsCompletedToday, openInvoiceTotal, waitingListCount, openTickets, revenueThisMonth, interruptedMessageCount]
      properties:
        leadCount: { type: integer }
        clientCount: { type: integer }
        jobsToday: { type: integer }
        jobsCompletedToday: { type: integer }
        openInvoiceTotal: { type: number }
        waitingListCount: { type: integer }
        openTickets: { type: integer }
        revenueThisMonth: { type: number }
        # Approved customer messages whose delivery was interrupted and never
        # reported an outcome — the customer may never have been contacted.
        interruptedMessageCount: { type: integer }
    DashboardAlertEstimate:
      type: object
      required: [id, clientId, clientName, total]
      properties:
        id: { type: integer }
        clientId: { type: integer }
        clientName: { type: string }
        total: { type: number }
        at: { type: ["string", "null"] }
    DashboardAlertInvoice:
      type: object
      required: [id, number, clientId, clientName, total]
      properties:
        id: { type: integer }
        number: { type: integer }
        clientId: { type: integer }
        clientName: { type: string }
        total: { type: number }
        at: { type: ["string", "null"] }
    DashboardAlertWebRequest:
      type: object
      required: [id]
      properties:
        id: { type: integer }
        name: { type: ["string", "null"] }
        address: { type: ["string", "null"] }
        message: { type: ["string", "null"] }
        at: { type: ["string", "null"] }
    DashboardAlertFailedEmail:
      type: object
      required: [id]
      properties:
        id: { type: integer }
        clientId: { type: ["integer", "null"] }
        clientName: { type: ["string", "null"] }
        toEmail: { type: ["string", "null"] }
        subject: { type: ["string", "null"] }
        error: { type: ["string", "null"] }
        at: { type: ["string", "null"] }
    DashboardAlerts:
      type: object
      required: [estimatesAccepted, invoicesSentToday, webRequests, failedEmails]
      properties:
        estimatesAccepted:
          type: object
          required: [count, items]
          properties:
            count: { type: integer }
            items:
              type: array
              items: { $ref: "#/components/schemas/DashboardAlertEstimate" }
        invoicesSentToday:
          type: object
          required: [count, items]
          properties:
            count: { type: integer }
            items:
              type: array
              items: { $ref: "#/components/schemas/DashboardAlertInvoice" }
        webRequests:
          type: object
          required: [count, items]
          properties:
            count: { type: integer }
            items:
              type: array
              items: { $ref: "#/components/schemas/DashboardAlertWebRequest" }
        failedEmails:
          type: object
          required: [count, items]
          properties:
            count: { type: integer }
            items:
              type: array
              items: { $ref: "#/components/schemas/DashboardAlertFailedEmail" }
    ContractorEarnings:
      type: object
      required: [contractorId, contractorName, jobCount, totalAmount]
      properties:
        contractorId: { type: integer }
        contractorName: { type: string }
        jobCount: { type: integer }
        totalAmount: { type: number }
        completedCount: { type: integer }
