        services:
          type: array
          items:
            $ref: "#/components/schemas/SpringLetterService"
        currentTotal: { type: number }
        newTotal: { type: number }
        lastRenewedAt: { type: ["string", "null"] }
        lastSendStatus: { type: ["string", "null"] }
        lastSendError: { type: ["string", "null"] }
        lastSentAt: { type: ["string", "null"] }
    SpringLetterRenewInput:
      type: object
      required: [clientIds]
      properties:
        clientIds:
          type: array
          items: { type: integer }
    SpringLetterRenewOutcome:
      type: object
      required: [clientId, clientName, ok]
      properties:
        clientId: { type: integer }
        clientName: { type: string }
        ok: { type: boolean }
