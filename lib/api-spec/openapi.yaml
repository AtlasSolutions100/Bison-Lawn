        actionType: { type: string, enum: [skip, reschedule] }
        rescheduleDays: { type: integer }
        messageTemplate: { type: ["string", "null"] }
        enabled: { type: boolean }
        createdAt: { type: string }
    WeatherRuleInput:
      type: object
      required: [name, conditionType, threshold, actionType]
      properties:
        name: { type: string, minLength: 1 }
        conditionType: { type: string, enum: [rain, wind, heat, cold] }
        threshold: { type: number }
        actionType: { type: string, enum: [skip, reschedule] }
        rescheduleDays: { type: integer, minimum: 1 }
        messageTemplate: { type: string }
        enabled: { type: boolean }
    WeatherRuleUpdate:
      type: object
      properties:
        name: { type: string, minLength: 1 }
        conditionType: { type: string, enum: [rain, wind, heat, cold] }
        threshold: { type: number }
        actionType: { type: string, enum: [skip, reschedule] }
        rescheduleDays: { type: integer, minimum: 1 }
        messageTemplate: { type: ["string", "null"] }
        enabled: { type: boolean }
    WeatherCheckInput:
      type: object
      required: [date]
      properties:
        date: { type: string }
    WeatherCheckResult:
      type: object
      required: [date, jobsChecked, suggestionsCreated, suggestions]
