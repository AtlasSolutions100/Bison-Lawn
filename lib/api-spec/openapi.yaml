          type: boolean
          description: "Create (or link) a lead client from this request"
        createTicket:
          type: boolean
          description: "Open a ticket on the task board for this request"
    WebRequestReceipt:
      type: object
      required: [id, status, duplicate]
      properties:
        id: { type: integer }
        status: { type: string }
        duplicate: { type: boolean }
    Ticket:
      type: object
      required: [id, title, status, createdAt]
      properties:
