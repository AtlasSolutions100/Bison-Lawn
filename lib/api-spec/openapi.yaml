openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: Bison Lawn Care CRM API
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
  - name: auth
  - name: clients
  - name: services
  - name: packages
  - name: estimates
  - name: jobs
  - name: invoices
  - name: payments
  - name: tickets
  - name: team
  - name: dashboard
  - name: fieldNotes
  - name: automation
  - name: sms
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /me:
    get:
      operationId: getCurrentUser
      tags: [auth]
      summary: Current authenticated app user (provisioned on first call)
      responses:
        "200":
          description: Current user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AppUser"
  /users:
    get:
      operationId: listUsers
      tags: [team]
      summary: List team members (admins and contractors); active people only unless includeInactive is set
      parameters:
        - name: includeInactive
          in: query
          schema: { type: boolean }
      responses:
        "200":
          description: Users
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AppUser"
  /users/{id}:
    patch:
      operationId: updateUser
      tags: [team]
      summary: Update a user's access level, permissions, details, or active flag
      parameters:
        - $ref: "#/components/parameters/IdParam"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AppUserUpdate"
      responses:
        "200":
          description: Updated user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AppUser"
    delete:
      operationId: deleteUser
      tags: [team]
      summary: Remove a person who has never had a job; otherwise deactivate them instead
      parameters:
        - $ref: "#/components/parameters/IdParam"
      responses:
        "204":
          description: Deleted
  /invitations:
    get:
      operationId: listInvitations
      tags: [team]
      summary: List pending and accepted invitations
      responses:
        "200":
          description: Invitations
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Invitation"
    post:
      operationId: createInvitation
      tags: [team]
      summary: Invite someone by email to join the team
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/InvitationInput"
      responses:
        "201":
          description: Created invitation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Invitation"
  /invitations/{id}/resend:
    post:
      operationId: resendInvitation
      tags: [team]
      summary: Send the invitation email again
      parameters:
        - $ref: "#/components/parameters/IdParam"
      responses:
        "200":
          description: The invitation, with the outcome of this send
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Invitation"
  /invitations/{id}:
    delete:
      operationId: revokeInvitation
      tags: [team]
      summary: Revoke an invitation that has not been accepted
      parameters:
        - $ref: "#/components/parameters/IdParam"
      responses:
        "204":
          description: Revoked
  /scheduling-rules:
    get:
      operationId: listSchedulingRules
      tags: [automation]
      summary: What happens automatically when an estimate is accepted
      responses:
        "200":
          description: Rules
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/SchedulingRule"
    post:
      operationId: createSchedulingRule
      tags: [automation]
      summary: Add a scheduling rule
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SchedulingRuleInput"
      responses:
        "201":
          description: Created rule
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SchedulingRule"
  /scheduling-rules/{id}:
    patch:
      operationId: updateSchedulingRule
      tags: [automation]
      summary: Change a scheduling rule
      parameters:
        - $ref: "#/components/parameters/IdParam"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SchedulingRuleUpdate"
      responses:
        "200":
          description: Updated rule
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SchedulingRule"
    delete:
      operationId: deleteSchedulingRule
      tags: [automation]
      summary: Delete a scheduling rule
      parameters:
        - $ref: "#/components/parameters/IdParam"
      responses:
        "204":
          description: Deleted
  /feedback:
    get:
      operationId: listFeedback
      tags: [feedback]
      summary: Read feedback submitted from inside the app
      parameters:
        - in: query
          name: status
          required: false
          schema: { type: string, enum: [new, read, done] }
      responses:
        "200":
          description: Feedback
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Feedback"
    post:
      operationId: createFeedback
      tags: [feedback]
      summary: Submit feedback from anywhere in the app
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FeedbackInput"
      responses:
        "201":
          description: Recorded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Feedback"
  /feedback/{id}:
    patch:
      operationId: updateFeedback
      tags: [feedback]
      summary: Triage a piece of feedback
      parameters:
        - $ref: "#/components/parameters/IdParam"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FeedbackUpdate"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Feedback"
  /company-profile:
    get:
      operationId: getCompanyProfile
      tags: [settings]
      summary: The business identity used in letters, estimates and emails
      responses:
        "200":
          description: Company profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CompanyProfile"
    put:
      operationId: updateCompanyProfile
      tags: [settings]
      summary: Update the business identity
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CompanyProfileInput"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CompanyProfile"
  /merge-tokens:
    get:
      operationId: listMergeTokens
      tags: [settings]
      summary: Every merge token a document template can use
      responses:
        "200":
          description: Tokens
          content:
            application/json:
              schema:
                type: array
                items: { type: string }
  /document-templates:
    get:
      operationId: listDocumentTemplates
      tags: [settings]
      summary: The letters and proposals the office sends
      parameters:
        - name: category
          in: query
          required: false
          schema: { type: string, enum: [client, marketing, estimate] }
      responses:
        "200":
          description: Templates
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/DocumentTemplate"
    post:
      operationId: createDocumentTemplate
      tags: [settings]
      summary: Add a document template
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DocumentTemplateInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DocumentTemplate"
  /document-templates/{id}:
    patch:
      operationId: updateDocumentTemplate
      tags: [settings]
      summary: Edit a document template
      parameters:
        - $ref: "#/components/parameters/IdParam"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DocumentTemplateUpdate"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DocumentTemplate"
    delete:
      operationId: deleteDocumentTemplate
      tags: [settings]
      summary: Delete a document template
      parameters:
        - $ref: "#/components/parameters/IdParam"
      responses:
        "204":
          description: Deleted
  /document-templates/{id}/preview:
    post:
      operationId: previewDocumentTemplate
      tags: [settings]
      summary: Render a template against a real client
      parameters:
        - $ref: "#/components/parameters/IdParam"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DocumentPreviewInput"
      responses:
        "200":
          description: Rendered preview
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DocumentPreview"
  /document-templates/{id}/send:
    post:
      operationId: sendDocumentTemplate
      tags: [settings]
      summary: Email a template to a list of customers, filled in per customer
      parameters:
        - $ref: "#/components/parameters/IdParam"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DocumentSendInput"
      responses:
        "200":
          description: Who was sent to and who was skipped
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DocumentSendResult"
  /email-activity/batches:
    get:
      operationId: listEmailBatches
      tags: [settings]
      summary: Every bulk email send, newest first, with sent / failed / skipped / opened counts
      parameters:
        - name: limit
          in: query
          required: false
          schema: { type: integer, minimum: 1, maximum: 500 }
      responses:
        "200":
          description: Batches
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/EmailBatch"
  /email-activity/batches/{batchId}:
    get:
      operationId: getEmailBatch
      tags: [settings]
      summary: Who was in one bulk send and whether each of them opened it
      parameters:
        - name: batchId
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Recipients
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/EmailBatchRecipient"
  /services/bulk-price-adjust:
    post:
      operationId: bulkAdjustServicePrices
      tags: [services]
      summary: Raise or lower every service price at once for the new season
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BulkPriceAdjustInput"
      responses:
        "200":
          description: What changed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BulkPriceAdjustResult"
  /quickbooks/status:
    get:
      operationId: getQuickbooksStatus
      tags: [quickbooks]
      summary: Whether QuickBooks is connected, and to which company
      responses:
        "200":
          description: Status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/QuickbooksStatus"
  /quickbooks/disconnect:
    post:
      operationId: disconnectQuickbooks
      tags: [quickbooks]
      summary: Forget the stored QuickBooks grant
      responses:
        "204":
          description: Disconnected
  /quickbooks/profit-and-loss:
    get:
      operationId: getQuickbooksProfitAndLoss
      tags: [quickbooks]
      summary: Profit and loss for a date range
      parameters:
        - in: query
          name: from
          required: false
          schema: { type: string }
        - in: query
          name: to
          required: false
          schema: { type: string }
      responses:
        "200":
          description: Report
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/QuickbooksReport"
  /quickbooks/expenses:
    get:
      operationId: getQuickbooksExpenses
      tags: [quickbooks]
      summary: Expenses by category for a date range
      parameters:
        - in: query
          name: from
          required: false
          schema: { type: string }
        - in: query
          name: to
          required: false
          schema: { type: string }
      responses:
        "200":
          description: Report
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/QuickbooksReport"
  /clients:
    get:
      operationId: listClients
      tags: [clients]
      summary: List clients/leads with optional filters
      parameters:
        - name: status
          in: query
          schema: { type: string, enum: [lead, client, former_client] }
        - name: search
          in: query
          schema: { type: string }
      responses:
        "200":
          description: Clients
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Client"
    post:
      operationId: createClient
      tags: [clients]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ClientInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Client"
  /clients/export:
    get:
      operationId: exportClients
      tags: [clients]
      summary: Download clients as a CSV file
      description: >-
        The same rows the list shows, as a spreadsheet. `ids` is what the office
        selected or filtered on screen; without it the status/search filters
        apply, and with neither every customer comes out. Opens in Excel with
        the UTF-8 marker so names with accents survive.
      parameters:
        - name: status
          in: query
          schema: { type: string, enum: [lead, client, former_client] }
        - name: search
          in: query
          schema: { type: string }
        - name: ids
          in: query
          description: Comma-separated client ids. Omit to export the whole filtered list.
          schema: { type: string }
      responses:
        "200":
          description: CSV file
          content:
            text/csv:
              schema: { type: string }
  /clients/bulk-update:
    post:
      operationId: bulkUpdateClients
      tags: [clients]
      summary: Change the same field on several clients at once
      description: >-
        The Actions menu on the client list. Fields left out are left alone —
        setting a route zone on forty customers must not blank their billing
        terms — so send only what the office touched, and null to clear it.
        Tags are added or removed on top of what each customer already has.
        One transaction, one audit line per customer so the change shows on
        each customer's own history.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/BulkClientUpdateInput" }
      responses:
        "200":
          description: What changed
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BulkClientResult" }
        "400":
          description: No client ids, or nothing to change
  /clients/bulk-delete:
    post:
      operationId: bulkDeleteClients
      tags: [clients]
      summary: Delete several clients, with everything attached to them
      description: >-
        POST rather than DELETE because it carries a body. Deleting a customer
        takes their invoices, payments, jobs, notes and history with them, so
        the office is shown the counts first: `preview: true` only counts,
        `preview: false` (the default) deletes. One transaction.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/BulkClientDeleteInput" }
      responses:
        "200":
          description: Counts of what went, or would go
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BulkClientDeleteResult" }
        "400":
          description: No client ids
  /clients/{id}:
    get:
      operationId: getClient
      tags: [clients]
      parameters:
        - $ref: "#/components/parameters/IdParam"
      responses:
        "200":
          description: Client
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Client"
    patch:
      operationId: updateClient
      tags: [clients]
      parameters:
        - $ref: "#/components/parameters/IdParam"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ClientUpdate"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Client"
    delete:
      operationId: deleteClient
      tags: [clients]
      parameters:
        - $ref: "#/components/parameters/IdParam"
      responses:
        "204":
          description: Deleted
  /clients/{id}/notes:
    get:
      operationId: listClientNotes
      tags: [clients]
      parameters:
        - $ref: "#/components/parameters/IdParam"
      responses:
        "200":
          description: Notes
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ClientNote"
    post:
      operationId: createClientNote
      tags: [clients]
      parameters:
        - $ref: "#/components/parameters/IdParam"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ClientNoteInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ClientNote"
  /clients/{id}/audit:
    get:
      operationId: listClientAudit
      tags: [clients]
      summary: Lazy-loaded audit trail for a client, newest first
      parameters:
        - $ref: "#/components/parameters/IdParam"
      responses:
        "200":
          description: Audit events
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AuditEvent"
  /client-activity:
    get:
      operationId: listClientActivity
      tags: [clients]
      summary: One timeline for a customer, newest first
      description: >-
        Visits, invoices, payments, emails (with opened / unopened), estimates,
        tickets, notes and audit events in one list, so the office can answer
        "what has happened with this customer" without opening five cards.
        Defaults to the last 90 days when no range is given; a long-standing
        customer has thousands of rows. Capped at 500 items. A query parameter
        rather than /clients/{id}/activity because the generator cannot name
        an operation that has both a path id and query parameters.
      parameters:
        - name: clientId
          in: query
          required: true
          schema: { type: integer }
        - name: from
          in: query
          description: yyyy-mm-dd, inclusive
          schema: { type: string }
        - name: to
          in: query
          description: yyyy-mm-dd, inclusive
          schema: { type: string }
        - name: kinds
          in: query
          description: Comma-separated subset of visit,invoice,payment,email,estimate,ticket,note,event
          schema: { type: string }
      responses:
        "200":
          description: Activity items
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ActivityItem"
        "400":
          description: Bad date
  /clients/{id}/jobs:
    get:
      operationId: listClientJobs
      tags: [jobs]
      summary: Every job on this customer, dispatched or still waiting, newest first
      description: >-
        The client page's All / Upcoming / History tabs. Unlike GET /jobs this
        includes waiting-list jobs (not yet dispatched) so the office sees the
        whole account, not just what is on the board.
      parameters:
        - $ref: "#/components/parameters/IdParam"
      responses:
        "200":
          description: Jobs
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Job"
  /client-notes/{id}:
    patch:
      operationId: updateClientNote
      tags: [clients]
      summary: Open or close a note
      parameters:
        - $ref: "#/components/parameters/IdParam"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ClientNoteUpdate"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ClientNote"
        "404":
          description: Note not found
  /notes/open:
    get:
      operationId: listOpenNotes
      tags: [clients]
      summary: Every open note across all customers, oldest first, for the dashboard
      responses:
        "200":
          description: Open notes
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ClientNote"
  /clients/{id}/email:
    post:
      operationId: emailClient
      tags: [clients]
      summary: Send a one-off email to a client from the office
      parameters:
        - $ref: "#/components/parameters/IdParam"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ClientEmailInput"
      responses:
        "200":
          description: Sent
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ClientEmailResult"
  /clients/sources:
    get:
      operationId: listClientSources
      tags: [clients]
      summary: Every "where they came from" answer already on file
      description: >-
        Comes from the customers themselves, not a settings list: typing a new
        source on a customer is what adds it here, the way map codes work.
      responses:
        "200":
          description: Sources, A to Z
          content:
            application/json:
              schema:
                type: array
                items: { type: string }
  /clients/{id}/related:
    get:
      operationId: listRelatedClients
      tags: [clients]
      summary: The properties under a master account, each with its own balance
      parameters:
        - $ref: "#/components/parameters/IdParam"
      responses:
        "200":
          description: Properties, A to Z
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Client"
  /clients/{id}/contacts:
    get:
      operationId: listClientContacts
      tags: [clients]
      summary: Extra people on the account (the CPA, the HOA contact, a spouse)
      parameters:
        - $ref: "#/components/parameters/IdParam"
      responses:
        "200":
          description: Contacts
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ClientContact"
    post:
      operationId: createClientContact
      tags: [clients]
      parameters:
        - $ref: "#/components/parameters/IdParam"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ClientContactInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ClientContact"
  /client-contacts/{id}:
    patch:
      operationId: updateClientContact
      tags: [clients]
      parameters:
        - $ref: "#/components/parameters/IdParam"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ClientContactUpdate"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ClientContact"
    delete:
      operationId: deleteClientContact
      tags: [clients]
      parameters:
        - $ref: "#/components/parameters/IdParam"
      responses:
        "204":
          description: Deleted
  /clients/{id}/client-services:
    get:
      operationId: listClientServices
      tags: [clients]
      summary: Services/packages assigned to a client
      parameters:
        - $ref: "#/components/parameters/IdParam"
      responses:
        "200":
          description: Client services
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ClientService"
    post:
      operationId: createClientService
      tags: [clients]
      summary: Assign a service or package to a client (creates jobs / waiting-list entries)
      parameters:
        - $ref: "#/components/parameters/IdParam"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ClientServiceInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ClientService"
  /client-services/{id}:
    patch:
      operationId: updateClientService
      tags: [clients]
      parameters:
