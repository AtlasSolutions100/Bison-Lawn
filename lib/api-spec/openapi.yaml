        updatedAt: { type: string }
    LetterTemplateInput:
      type: object
      required: [subject, body]
      properties:
        name: { type: string }
        subject: { type: string, minLength: 1 }
        body: { type: string, minLength: 1 }
    SpringLetterService:
      type: object
      required: [clientServiceId, serviceName, currentAmount, newAmount]
