        clientId: { type: integer }
        clientName: { type: ["string", "null"] }
        clientAddress: { type: ["string", "null"] }
        clientEmail:
          type: ["string", "null"]
          description: Where an emailed invoice goes (billing email, else the contact email)
        clientDoNotEmail: { type: boolean }
        jobId: { type: ["integer", "null"] }
        serviceName: { type: ["string", "null"] }
        status: { type: string, enum: [pending, open, paid, partial, void] }
        total: { type: number }
        amountPaid: { type: number }
        balance:
          type: number
          description: total minus amountPaid, never negative
        accountBalance:
