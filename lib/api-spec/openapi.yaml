            the same job as a 19,000 sqft one. Null means no estimate for this
            band, which is deliberately distinct from zero.
        budgetedCost:
          type: ["number", "null"]
          description: >-
            Expected cost to deliver a job in this band, for job costing against
            the rate. Null means no estimate, not zero.
