          in: query
          schema: { type: string, enum: [pending, open, paid, partial, void] }
        - name: queue
          in: query
          description: >-
            His invoice tabs. pending = completed jobs waiting for him to verify;
            to_email / to_print = verified and not yet sent by that method;
            open = anything still owed; past_due = open and past its due date
            (invoice date when the terms are due on receipt).
          schema: { type: string, enum: [pending, to_email, to_print, open, past_due, paid, void] }
        - name: search
          in: query
          description: Customer name, address or invoice number
          schema: { type: string }
      responses:
        "200":
          description: Invoices
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Invoice"
