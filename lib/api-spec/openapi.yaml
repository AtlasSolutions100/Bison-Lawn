  /waiting-list:
    get:
      operationId: listWaitingList
      tags: [jobs]
      summary: Jobs with date windows not yet dispatched; filter by date range
      description: >-
        A waiting-list job only shows when the chosen `date` sits inside its
        window. `window=past` lists the ones whose window has already closed
        so they can be cancelled in bulk; `window=all` shows everything still
        waiting. Cancelled and completed jobs stay out unless `status` asks
        for them.
      parameters:
        - name: date
          in: query
          schema: { type: string }
        - name: from
          in: query
          schema: { type: string }
        - name: to
          in: query
          schema: { type: string }
        - name: window
          in: query
          schema: { type: string, enum: [open, past, all] }
        - name: serviceId
          in: query
          schema: { type: integer }
        - name: assignedTo
          in: query
          schema: { type: integer }
        - name: mapCode
          in: query
          schema: { type: string }
        - name: city
          in: query
          schema: { type: string }
        - name: branch
          in: query
          description: "The client's state: ID or WA."
          schema: { type: string }
        - name: tag
          in: query
          schema: { type: string }
        - name: hasNotes
          in: query
          schema: { type: boolean }
        - name: search
          in: query
          description: Matches the client name or service address, any part of it.
          schema: { type: string }
        - name: status
          in: query
          schema: { type: string, enum: [scheduled, on_the_way, in_progress, completed, skipped, cancelled] }
      responses:
        "200":
          description: Waiting list jobs
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Job"
