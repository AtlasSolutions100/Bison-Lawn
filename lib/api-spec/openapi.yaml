        roleSource: { type: string, enum: [provisioned, owner, owner_assigned] }
        accessLevel: { $ref: "#/components/schemas/AccessLevel" }
        # Grants ("quickbooks") and denials ("!quickbooks") on top of the level
        permissions:
          type: array
          items: { type: string }
        # Every area this person can open, worked out on the server so the sidebar and the guards agree
        areas:
          type: array
          items: { $ref: "#/components/schemas/AccessArea" }
        active: { type: boolean }
        phone: { type: ["string", "null"] }
        birthday: { type: ["string", "null"] }
        hireDate: { type: ["string", "null"] }
        baseAddress: { type: ["string", "null"] }
        baseLat: { type: ["number", "null"] }
        baseLng: { type: ["number", "null"] }
