        name: { type: string }
        email: { type: string }
        phone: { type: string }
        address: { type: string }
        message: { type: string }
        raw:
          type: object
          additionalProperties: true
          description: "The submission exactly as received, kept so nothing is lost when field names change"
    WebRequestUpdate:
      type: object
      properties:
        status: { type: string, enum: [new, converted, dismissed] }
