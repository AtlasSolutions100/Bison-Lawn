    BillingSettings:
      type: object
      required: [cardFeeEnabled, cardFeePercent]
      properties:
        cardFeeEnabled: { type: boolean }
        cardFeePercent: { type: number }
    BillingSettingsUpdate:
      type: object
      properties:
        cardFeeEnabled: { type: boolean }
        cardFeePercent: { type: number, minimum: 0, maximum: 25 }
    OnSitePaymentInput:
      type: object
      required: [amount, method]
      properties:
        amount: { type: number, minimum: 0.01 }
        method: { type: string, enum: [cash, check, credit_card] }
        reference: { type: string }
        notes: { type: string }
    OnSitePayment:
      type: object
      required: [id, clientId, amount, method, baseAmount, cardFee, createdAt]
      properties:
        id: { type: integer }
        clientId: { type: integer }
        invoiceId: { type: ["integer", "null"] }
        jobId: { type: ["integer", "null"] }
        amount: { type: number }
        baseAmount: { type: number }
        cardFee: { type: number }
        cardFeePercent: { type: ["number", "null"] }
        method: { type: string }
        reference: { type: ["string", "null"] }
        notes: { type: ["string", "null"] }
        createdAt: { type: string }
    VendorRunRow:
      type: object
      required: [clientId, clientName, clientServiceId, amount, status]
      properties:
        clientId: { type: integer }
        clientName: { type: string }
        city: { type: ["string", "null"] }
        clientServiceId: { type: integer }
        amount: { type: number }
        status:
          type: string
          enum: [not_scheduled, scheduled, completed, invoiced]
          description: "not_scheduled means this customer has the service but no job in the window — the ones most easily missed"
        jobId: { type: ["integer", "null"] }
        invoiceId: { type: ["integer", "null"] }
        lastCompletedDate: { type: ["string", "null"] }
    VendorRunInput:
