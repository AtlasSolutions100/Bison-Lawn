    VendorRunOutcome:
      type: object
      required: [clientId, clientName, status]
      properties:
        clientId: { type: integer }
        clientName: { type: string }
        status: { type: string, enum: [completed, skipped, failed] }
        invoiceId: { type: ["integer", "null"] }
        reason: { type: ["string", "null"] }
    VendorRunResult:
      type: object
      required: [completed, skipped, failed, outcomes]
      properties:
        completed: { type: integer }
        skipped: { type: integer }
