    EstimateLine:
      type: object
      description: >-
        A line on an estimate. With a fieldId or serviceId the price is computed server-side from that
        definition; with neither it is a custom one-off charge (haul-away, dump fee, discount) whose
        label and submitted price are validated and kept as entered.
      required: [label, value]
      properties:
        fieldId: { type: ["integer", "null"], description: "Reference to a reusable estimate field" }
        serviceId: { type: ["integer", "null"], description: "Reference to a service priced by its equations" }
        label: { type: string }
        value: { type: string, description: "Entered value for field/service lines, optional description for custom lines" }
        calculatedPrice:
          type: ["number", "null"]
          description: "Server-computed for field/service lines; required and kept as submitted for custom lines"
        unitPrice:
          type: ["number", "null"]
          description: "Service lines only. The per-visit rate the band (or the flat rate) gave; calculatedPrice = unitPrice x quantity x visits"
        quantity:
          type: ["number", "null"]
          description: "Service lines only. Null means the service's own default quantity"
        visits:
          type: ["integer", "null"]
          description: "Service lines only. Visits per season (28 mows). Null means the service's visitsPerSeason, or one"
        hours:
          type: ["number", "null"]
          description: >-
            Server-computed, time-billed service lines only: the hours one visit is budgeted for.
            unitPrice is those hours at the service's hourly rate, so the quote shows what a visit costs.
        packageId: { type: ["integer", "null"], description: "Set when this line was added as part of a package" }
        packageKey:
          type: ["string", "null"]
          description: "Lines added together from one package share this key; the customer accepts or declines them as one"
        packageName: { type: ["string", "null"], description: "The package name as it read when the line was added" }
    Estimate:
