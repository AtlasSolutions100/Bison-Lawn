        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WebRequestInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WebRequest"
  /web-requests/{id}:
    patch:
      operationId: updateWebRequest
      tags: [web-requests]
      summary: Convert a request into a client and ticket, or dismiss it
      parameters:
        - $ref: "#/components/parameters/IdParam"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WebRequestUpdate"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WebRequest"
  /inbound/web-request:
    post:
      operationId: receiveWebRequest
      tags: [web-requests]
      summary: Public webhook the website posts form submissions to; authenticated by a shared secret header
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WebRequestInput"
      responses:
        "202":
          description: Accepted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WebRequestReceipt"
  /jobs/{id}/clock-in:
    post:
      operationId: clockInToJob
      tags: [jobs]
      summary: Start a time entry on a job, recording where the phone was
      parameters:
        - $ref: "#/components/parameters/IdParam"
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ClockInput" }
      responses:
        "201":
          description: Clocked in
          content:
            application/json:
              schema: { $ref: "#/components/schemas/JobTimeEntry" }
        "409":
          description: Already clocked in to this job
  /jobs/{id}/clock-out:
    post:
      operationId: clockOutOfJob
      tags: [jobs]
      summary: Close the open time entry on a job
      parameters:
        - $ref: "#/components/parameters/IdParam"
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ClockInput" }
      responses:
        "200":
          description: Clocked out
          content:
            application/json:
              schema: { $ref: "#/components/schemas/JobTimeEntry" }
        "409":
          description: Not clocked in
  /jobs/{id}/time-entries:
    get:
      operationId: listJobTimeEntries
      tags: [jobs]
      summary: Every clock-in and clock-out on this job, newest first
      parameters:
        - $ref: "#/components/parameters/IdParam"
      responses:
        "200":
          description: Time entries
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/JobTimeEntry" }
  /jobs/{id}/photos:
    get:
      operationId: listJobPhotos
      tags: [photos]
      summary: Photos taken on this job
      parameters:
        - $ref: "#/components/parameters/IdParam"
      responses:
        "200":
          description: Photos
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/JobPhoto" }
    post:
      operationId: uploadJobPhoto
      tags: [photos]
      summary: Attach a photo to a job
      parameters:
        - $ref: "#/components/parameters/IdParam"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PhotoUploadInput" }
      responses:
        "201":
          description: Stored
          content:
            application/json:
              schema: { $ref: "#/components/schemas/JobPhoto" }
        "400":
          description: Unsupported type, empty, or over the size limit
  /clients/{id}/photos:
    get:
      operationId: listClientPhotos
      tags: [photos]
      summary: Every photo on this customer, across all their jobs
      parameters:
        - $ref: "#/components/parameters/IdParam"
      responses:
        "200":
          description: Photos
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/JobPhoto" }
    post:
      operationId: uploadClientPhoto
      tags: [photos]
      summary: Attach a photo or PDF straight to the customer, with no job
      description: >-
        The office's "save it to the customer profile" — a photo from the
        field forwarded by text, a backflow test form, a photo of the gate.
        Same limits as a job photo; stored with no job behind it.
      parameters:
        - $ref: "#/components/parameters/IdParam"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PhotoUploadInput" }
      responses:
        "201":
          description: Stored
          content:
            application/json:
              schema: { $ref: "#/components/schemas/JobPhoto" }
        "400":
          description: Unsupported type, empty, or over the size limit
        "404":
          description: Client not found
  /photos/{id}:
    patch:
      operationId: updatePhoto
      tags: [photos]
      summary: Relabel a photo (before / after / other) or change its caption
      parameters:
        - $ref: "#/components/parameters/IdParam"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PhotoUpdate" }
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/JobPhoto" }
    delete:
      operationId: deletePhoto
      tags: [photos]
      summary: Delete a photo and the bytes behind it
      parameters:
        - $ref: "#/components/parameters/IdParam"
      responses:
        "204":
          description: Deleted
  /photos/{id}/content:
    get:
      operationId: getPhotoContent
      tags: [photos]
      summary: The image bytes, behind the same auth as the rest of the app
      parameters:
        - $ref: "#/components/parameters/IdParam"
      responses:
        "200":
          description: Image
          content:
            application/octet-stream:
              schema: { type: string, format: binary }
  /waiting-list/build-route:
    post:
      operationId: buildRouteFromWaitingList
      tags: [routing]
      summary: Cut a route out of the waiting list, capped by money, stops or hours
      description: >-
        Previews by default. Nothing is scheduled unless apply is true, so the
        office can see which jobs would be pulled and how many would be left
        behind before committing four hundred blow-outs to a date.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RouteBuildInput" }
      responses:
        "200":
          description: The proposed route
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RouteBuildResult" }
        "400":
          description: Invalid cap or date

  /reports/costing:
    get:
      operationId: getCostingReport
      tags: [reports]
      summary: Budgeted against actual hours, by crew, service and customer
      parameters:
        - { name: from, in: query, required: true, schema: { type: string } }
        - { name: to, in: query, required: true, schema: { type: string } }
      responses:
        "200":
          description: Job costing
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CostingReport" }
        "400":
          description: Invalid date range
  /reports/ask:
    post:
      operationId: askReportQuestion
      tags: [reports]
      summary: Ask a question in plain English about the business's own data
      description: >-
        The model chooses which curated report answers the question and writes
        the prose around the result. It never writes a query and never produces a
        figure; every number comes from the report that ran, and the rows are
        returned alongside so the answer can be checked.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ReportQuestion" }
      responses:
        "200":
          description: The answer, with the rows it was drawn from
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ReportAnswer" }
        "400":
          description: Missing or malformed question or range
        "502":
          description: The assistant could not answer
  /reports/catalogue:
    get:
      operationId: getReportCatalogue
      tags: [reports]
      summary: Every report the page can open, with the sentences the picker shows
      responses:
        "200":
          description: Catalogue
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ReportCatalogue" }
  /reports/run:
    get:
      operationId: getReport
      tags: [reports]
      summary: One curated report over a date range (format=csv returns a file)
      parameters:
        - { name: key, in: query, required: true, schema: { type: string } }
        - { name: from, in: query, required: true, schema: { type: string } }
        - { name: to, in: query, required: true, schema: { type: string } }
        - { name: format, in: query, required: false, schema: { type: string, enum: [json, csv] } }
      responses:
        "200":
          description: The report
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ReportResult" }
        "400":
          description: Invalid date range
        "404":
          description: No such report
  /search:
    get:
      operationId: globalSearch
      tags: [search]
      summary: One box across clients (including former), tickets, invoices, payments and jobs by address
      parameters:
        - { name: q, in: query, required: true, schema: { type: string, minLength: 2 } }
      responses:
        "200":
          description: Hits, grouped and capped per group
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SearchResults" }
        "400":
          description: Fewer than two characters

  /jobs/bulk-assign:
    post:
      operationId: bulkAssignJobs
      tags: [jobs]
      summary: Move, assign or re-order several jobs at once
      description: >-
        What the dispatch map's group selection commits. One transaction: either
        every job in the selection moves or none does, because a half-applied
        change across forty stops is not something a dispatcher can unpick.
        Fields left out are left alone, so assigning a crew does not clear a date
        somebody set.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/BulkAssignInput" }
      responses:
        "200":
          description: What changed
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BulkAssignResult" }
        "400":
          description: No job ids, or an invalid date
  /jobs/bulk-action:
    post:
      operationId: bulkJobAction
      tags: [jobs]
      summary: Do one thing to every selected job on the board or the waiting list
      description: >-
        The bulk actions bar. Tick some rows (or select all), pick what to do,
        and it happens to every one of them in one transaction. A job that
        cannot take the action — a completed job cannot be cancelled, sent
        back to the waiting list or deleted, because its invoice already
        exists — is left alone and reported in `skippedIds` rather than
        failing the whole batch.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/BulkJobActionInput" }
      responses:
        "200":
          description: What changed
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BulkJobActionResult" }
        "400":
          description: No job ids, or the action is missing what it needs

  # ---- GPS: where the crew is (track GPS-SMS) ----
  /my/location:
    post:
      operationId: reportMyLocation
      tags: [team]
      summary: A contractor's phone says where it is, while they are on a job
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/LocationReport" }
      responses:
        "204":
          description: Recorded
  /team/locations:
    get:
      operationId: listTeamLocations
      tags: [team]
      summary: Where each contractor last was, and whether they are at a job, on the way, or idle
      parameters:
        - name: date
          in: query
          description: The dispatch day to judge "at a job" against; today when omitted
          schema: { type: string }
      responses:
        "200":
          description: Latest position per person
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/TeamLocation" }
  # ---- Texting (track GPS-SMS) ----
  /sms/status:
    get:
      operationId: getSmsStatus
      tags: [sms]
      summary: Whether texting is switched on, which numbers it uses, and what it takes to turn on
      responses:
        "200":
          description: Texting status
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SmsStatus" }
  /clients/{id}/sms:
    get:
      operationId: listClientSms
      tags: [sms]
      summary: Every text to or from this customer, newest last
      parameters:
        - $ref: "#/components/parameters/IdParam"
      responses:
        "200":
          description: The thread
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/SmsMessage" }
    post:
      operationId: sendClientSms
      tags: [sms]
      summary: Office texts a customer, from the office number or a contractor's masked number
      parameters:
        - $ref: "#/components/parameters/IdParam"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SendSmsInput" }
      responses:
        "200":
          description: Sent (or failed, with the provider's reason)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SendSmsResult" }
        "400":
          description: No mobile number to send to, or no number to send from
        "503":
          description: Texting is not switched on for this server
  /jobs/{id}/sms:
    post:
      operationId: sendJobSms
      tags: [sms]
      summary: The contractor on a job texts its customer from their masked number
      parameters:
        - $ref: "#/components/parameters/IdParam"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/JobSmsInput" }
      responses:
        "200":
          description: Sent (or failed, with the provider's reason)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SendSmsResult" }
        "400":
          description: The customer has no mobile number, or this person has no texting number
        "503":
          description: Texting is not switched on for this server
  /users/{id}/sms-number:
    put:
      operationId: setUserSmsNumber
      tags: [sms]
      summary: Give a person the masked texting number customers will see, or take it away
      parameters:
        - $ref: "#/components/parameters/IdParam"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SmsNumberInput" }
      responses:
        "200":
          description: Updated user
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AppUser" }
        "400":
          description: Not a phone number, or another person already has it
  /public/sms/inbound:
    post:
      operationId: receiveInboundSms
      tags: [sms]
      summary: Public webhook the texting provider posts customer replies to; authenticated by the provider's request signature
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema: { $ref: "#/components/schemas/InboundSmsInput" }
      responses:
        "200":
          description: Acknowledged (TwiML)
          content:
            text/xml:
              schema: { type: string }
        "403":
          description: The request was not signed by the provider
  # ---- "Crew is on their way" (feedback 49, track GPS-SMS) ----
  /my/jobs/{id}/on-the-way-notice:
    get:
      operationId: getOnTheWayNotice
      tags: [jobs]
      summary: Whether the customer of this job can be emailed that the crew is on the way
      parameters:
        - $ref: "#/components/parameters/IdParam"
      responses:
        "200":
          description: Can it be sent, and was it already
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OnTheWayNotice" }
    post:
      operationId: sendOnTheWayNotice
      tags: [jobs]
      summary: Email the customer the "on the way" document for this job
      parameters:
        - $ref: "#/components/parameters/IdParam"
      responses:
        "200":
          description: Sent, or why not
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OnTheWayNoticeResult" }

components:
  parameters:
    IdParam:
      name: id
      in: path
      required: true
      schema:
        type: integer
  schemas:
    BulkAssignInput:
      type: object
      required: [jobIds]
      properties:
        jobIds:
          type: array
          items: { type: integer }
          minItems: 1
        assignedToId:
          type: ["integer", "null"]
          description: "Crew to assign. Omit to leave alone; null to unassign."
        scheduledDate:
          type: ["string", "null"]
          description: "yyyy-mm-dd. Omit to leave alone."
        dispatched:
          type: ["boolean", "null"]
          description: "Omit to leave alone. True moves waiting-list work onto the board."
        routeOrderFrom:
          type: ["integer", "null"]
          description: >-
            Number the selection sequentially from here, in the order the ids
            were given, so the dispatcher's own ordering is what gets written.
        clearRouteOrder:
          type: boolean
          description: >-
            Wipe the route numbers off these jobs. This is the first half of
            "set route order": clear, then click the stops in the order they
            should be driven.
    BulkAssignResult:
      type: object
      required: [updated]
      properties:
        updated: { type: integer }
        jobIds:
          type: array
          items: { type: integer }
    BulkJobActionInput:
      type: object
      required: [jobIds, action]
      properties:
        jobIds:
          type: array
          items: { type: integer }
          minItems: 1
        action:
          type: string
          enum: [move, assign, dispatch, waiting_list, cancel, skip, delete, add_note]
          description: >-
            move = change the date; assign = change the contractor (null
            unassigns); dispatch = waiting list onto the board for a date;
            waiting_list = off the board, back to waiting; cancel / skip =
            terminal statuses with a reason; delete = gone; add_note = append
            a note to each job, e.g. "NO EMAIL - call or text".
        scheduledDate:
          type: ["string", "null"]
          description: "yyyy-mm-dd. Needed by move and dispatch."
        assignedToId:
          type: ["integer", "null"]
          description: "Needed by assign (null = unassign); optional on dispatch."
        reason:
          type: ["string", "null"]
          description: Why, for cancel and skip. Shown on the row.
        note:
          type: ["string", "null"]
          description: The text add_note appends to each job's notes.
        notesImportant:
          type: boolean
          description: "With add_note: flag the note so it shows red on the board."
    BulkJobActionResult:
      type: object
      required: [action, updated, jobIds, skippedIds]
      properties:
        action: { type: string }
        updated: { type: integer }
        jobIds:
          type: array
          items: { type: integer }
          description: The jobs the action was applied to.
        skippedIds:
          type: array
          items: { type: integer }
          description: Jobs left alone because the action does not apply to them (completed jobs, mostly).
        skipNotices:
          type: array
          items: { type: string }
          description: "For skip: the free-or-chargeable verdict per job, in plain words."
    BulkClientUpdateInput:
      type: object
      required: [clientIds]
      properties:
        clientIds:
          type: array
          items: { type: integer }
          minItems: 1
        status:
          type: string
          enum: [lead, client, former_client]
          description: "Activate = client, deactivate = former_client. Omit to leave alone."
        mapCode:
          type: ["string", "null"]
          description: "Route zone, e.g. PF. Omit to leave alone; null to clear."
        waterDistrict: { type: ["string", "null"] }
        state:
          type: ["string", "null"]
          description: "His branch: ID or WA. Omit to leave alone; null to clear."
        accountType:
          type: ["string", "null"]
          enum: [commercial, residential, null]
        billingTerms: { type: ["string", "null"], description: "Payment window, e.g. Net 15" }
        invoiceFrequency: { type: ["string", "null"] }
        invoiceDelivery:
          type: ["string", "null"]
          enum: [email, print, both, null]
        doNotEmail:
          type: ["boolean", "null"]
          description: "Omit to leave alone."
        addTags:
          type: array
          items: { type: string }
          description: Added to each customer's existing tags (stored lowercase).
        removeTags:
          type: array
          items: { type: string }
    BulkClientResult:
      type: object
      required: [updated, clientIds]
      properties:
        updated: { type: integer }
        clientIds:
          type: array
          items: { type: integer }
    BulkClientDeleteInput:
      type: object
      required: [clientIds]
      properties:
        clientIds:
          type: array
          items: { type: integer }
          minItems: 1
        preview:
          type: boolean
          description: "True only counts what would go, so the confirm can say so. Default false."
    BulkClientDeleteResult:
      type: object
      required: [preview, clients, invoices, payments, jobs]
      properties:
        preview: { type: boolean }
        clients: { type: integer, description: Clients matched (or deleted). }
        invoices: { type: integer }
        payments: { type: integer }
        jobs: { type: integer }
    CostingRow:
      type: object
      required: [key, label, jobs, measuredJobs, revenue]
      properties:
        key: { type: string }
        label: { type: string }
        jobs: { type: integer }
        measuredJobs:
          type: integer
          description: >-
            How many of those jobs have a closed clock entry. Everything derived
            from actual hours rests on this number.
        revenue: { type: number }
        budgetedHours: { type: ["number", "null"] }
        actualHours:
          type: ["number", "null"]
          description: "Null means the work was never clocked, which is not the same as zero hours"
        varianceHours:
          type: ["number", "null"]
          description: "actual minus budgeted; positive means it took longer than it was priced for"
        revenuePerHour: { type: ["number", "null"] }
    CostingSummary:
      type: object
      required: [from, to, completedJobs, measuredJobs, revenue]
      properties:
        from: { type: string }
        to: { type: string }
        completedJobs: { type: integer }
        measuredJobs: { type: integer }
        revenue: { type: number }
        budgetedHours: { type: ["number", "null"] }
        actualHours: { type: ["number", "null"] }
        varianceHours: { type: ["number", "null"] }
        revenuePerHour: { type: ["number", "null"] }
    CostingReport:
      type: object
      required: [summary, bySub, byService, byClient, assistantAvailable]
      properties:
        summary: { $ref: "#/components/schemas/CostingSummary" }
        bySub:
          type: array
          items: { $ref: "#/components/schemas/CostingRow" }
        byService:
          type: array
          items: { $ref: "#/components/schemas/CostingRow" }
        byClient:
          type: array
          items: { $ref: "#/components/schemas/CostingRow" }
        assistantAvailable:
          type: boolean
          description: "Whether an XAI_API_KEY is set, so the UI can hide the question box rather than offer a control that always fails"
    ReportQuestion:
      type: object
      required: [question, from, to]
      properties:
        question: { type: string, maxLength: 500 }
        from: { type: string }
        to: { type: string }
    ReportColumn:
      type: object
      required: [key, label, kind]
      properties:
        key: { type: string }
        label: { type: string }
        kind: { type: string, enum: [text, money, number, hours, date, sqft, link] }
    ReportRow:
      type: object
      description: One row of a curated report; the keys are the report's column keys
      additionalProperties: true
    ReportTotals:
      type: object
      description: Totals for the columns the report marks summable
      additionalProperties: { type: number }
    ReportAnswer:
      type: object
      required: [question, answer, columns, rows, assistantUsed]
      properties:
        question: { type: string }
        reportKey: { type: ["string", "null"] }
        reportTitle: { type: ["string", "null"] }
        answer: { type: string }
        columns:
          type: array
          items: { $ref: "#/components/schemas/ReportColumn" }
        rows:
          type: array
          items: { $ref: "#/components/schemas/ReportRow" }
        totals:
          oneOf:
            - $ref: "#/components/schemas/ReportTotals"
            - type: "null"
        assistantUsed:
          type: boolean
          description: "False when the question was routed on its words alone, with no model summary"
    ReportCatalogueEntry:
      type: object
      required: [key, title, describes, asks, columns]
      properties:
        key: { type: string }
        title: { type: string }
        describes: { type: string }
        asks:
          type: array
          items: { type: string }
        columns:
          type: array
          items: { $ref: "#/components/schemas/ReportColumn" }
    ReportCatalogue:
      type: object
      required: [assistantAvailable, reports]
      properties:
        assistantAvailable: { type: boolean }
        reports:
          type: array
          items: { $ref: "#/components/schemas/ReportCatalogueEntry" }
    ReportResult:
      type: object
