      properties:
        serviceId: { type: integer }
        label: { type: ["string", "null"] }
        windowStart: { type: ["string", "null"], description: "yyyy-mm-dd" }
        windowEnd: { type: ["string", "null"], description: "yyyy-mm-dd" }
    ServicePackage:
      type: object
      description: >-
