      responses:
        "200":
          description: Sent
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SendInvoiceResult"
        "400":
          description: No email address on file, or the invoice is void
  /invoices/{id}/verify:
    post:
      operationId: verifyInvoice
      tags: [invoices]
      summary: >-
        He has checked the invoice. Stamps verifiedAt, snapshots the customer's
        delivery preference (email / print / both) and moves it from pending to
        open, so it shows up in the to-email or to-print queue. The due date is
        worked out again from the day it is verified (the invoice date stays the
        day of the work), so a bill sent at month end is not already past due.
      parameters:
        - $ref: "#/components/parameters/IdParam"
      responses:
        "200":
          description: Verified
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Invoice"
        "400":
          description: Void, or already verified
