<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" fill="none">
  <!--
    Tab icon. The nav logo (logo.svg) is not usable at this size: its wordmark
    renders about 1.3px tall at 16px and its 10/20 dashed ring aliases into
    noise, so a straight copy reads as a smudge. Same mark, same palette, with
    both dropped and the silhouette scaled into the space they vacated.

    Colours are inverted relative to the nav logo on purpose - measured against
    Chrome tab-strip grey, cream-on-green stays legible at 16px where
    green-on-cream washes out.

    Geometry is not eyeballed: the path bounding box measured 190x120.9 centred
    at (200, 194.6), so the transform below centres on that and scales to
    400 - 2*40 padding. Re-derive it if the path ever changes.
  -->
  <rect width="400" height="400" rx="72" fill="#20603d"/>
  <g transform="translate(200 200) scale(1.684) translate(-200 -194.6)">
    <path d="M295 180c-15-25-45-40-75-45-20-3-45 2-60 10-15 10-30 25-40 45-5 10-15 35-15 45 0 15 10 20 20 20 5 0 15-5 25-15 10-10 20-35 30-40 10-5 25-5 40 0 10 5 20 15 30 30 5 10 15 20 25 20s20-10 20-25c0-15 0-35-10-45" fill="#f8f6f3"/>
  </g>
</svg>
