# Overlay for a host where a reverse-proxy container already owns 80/443.
#
# The app publishes no host port; the proxy reaches it by container name over a
# shared Docker network.
#
#   docker compose --env-file .env.deploy \
#     -f docker-compose.yml -f docker-compose.proxy.yml up -d --build
#
# IMPORTANT — use a DEDICATED network, not the proxy's own project network.
# Attaching this stack to another project's network (e.g. takeoff_default) makes
# `docker compose down` on that project fail with "network in use", because this
# container is still attached. A separate shared network keeps the two projects
# independent in both directions. Create it once:
#
#   docker network create web-proxy
#   docker network connect web-proxy takeoff-caddy-1   # live; no restart
#
# Then set PROXY_NETWORK=web-proxy in .env.deploy.
#
# Trade-off, stated plainly: if the proxy's own stack is later recreated
# (`docker compose up -d` in its directory), Compose may drop the manually added
# network from the proxy container and this site starts returning 502 until
# `docker network connect web-proxy <proxy-container>` is run again. That
# failure lands on THIS app, never on the proxy's own site — which is the right
# way round.
services:
  app:
    # Drop the host port binding from the base file.
    ports: !reset []
    networks:
      - default
      - proxy
    # Traefik only. Caddy/nginx users add a vhost pointing at
    # http://bisonlawn-app:8080 instead.
    # labels:
    #   traefik.enable: "true"
    #   traefik.http.routers.bisonlawn.rule: "Host(`bisonlawn.workoptional.tech`)"
    #   traefik.http.routers.bisonlawn.entrypoints: "websecure"
    #   traefik.http.routers.bisonlawn.tls.certresolver: "letsencrypt"
    #   traefik.http.services.bisonlawn.loadbalancer.server.port: "8080"
    container_name: bisonlawn-app

networks:
  proxy:
    external: true
    name: "${PROXY_NETWORK:?set PROXY_NETWORK in .env.deploy - create the network first with docker network create web-proxy}"
